          - paragraph [ref=f1e487]: 直到20世纪80年代，每个计算机制造商都设计了自己的表示浮点数的规则，以及对 浮点数执行运算的细节。另外，它们常常不会太多地关注运算的精确性，而把实现的速度 和简便性看得比数字精确性更重要。 •大约在1985年，这些情况随着IEEE 标准754的推出而改变了，这是一个仔细制订的 表示浮点数及其运算的标准。这项工作是从1976年开始由Intel 赞助的，与8087的设计 同时进行，8087是一种为8086处理器提供浮点支持的芯片。他们请 William Kahan（加州 大学伯克利分校的一位教授）作为顾问，帮助设计未来处理器浮点标准。他们支持 Kahan 加入一个 IEEE 资助的制订工业标准的委员会。这个委员会最终采纳的标准非常接近于 Kahan 为Intel 设计的标准。目前，实际上所有的计算机都支持这个后来被称为IEEE 浮 点的标准。这大大提高了科学应用程序在不同机器上的可移植性。 旁注 IEEE（电气和电子工程师协会） 电气和电子工程师协会（IEEE，读做“eye-triple-ee”）是一个包括所有电子和计算机 技术的专业团体。它出版刊物，举办会议，并且建立委员会来定义标准，内容涉及从电 力传输到软件工程。另一个IEEE 标准的例子是无线网络的802.11 标准。
          - paragraph [ref=f1e488]: 在本节中，我们将看到IEEE 浮点格式中数字是如何表示的。我们还将探讨入 （rounding）的问题，即当一个数字不能被准确地表示为这种格式时，就必须向上调整或者 向下调整。然后，我们将探讨加法、乘法和关系运算符的数学属性。许多程序员认为浮点 数没意思，往坏了说，深奥难懂。我们将看到，因为IEEE 格式是定义在一组小而一致的 原则上的，所以它实际上是相当优雅和容易理解的。
