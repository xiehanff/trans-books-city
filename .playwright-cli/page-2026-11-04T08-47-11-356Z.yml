          - paragraph [ref=e251]: 最后，我们要感谢 Prentice Hall 出版社的朋友们。Marcia Horton 总是支持着我们。 我们的编辑 Matt Goldstein 由始至终表现出了一流的领导才能。我们由衷地感谢他们的帮 助、鼓励和真知灼见。 第1版的致谢
          - paragraph [ref=e252]: 我们衷心地感谢那些给了我们中肯批评和鼓励的众多朋友及同事。特别感谢我们15- 213课程的学生们，他们充满感染力的精力和热情鞭策我们前行。Nick Carter 和 Vinny Furia 无私地提供了他们的 malloc 程序包。
          - paragraph [ref=e253]: Guy Blelloch、Greg Kesden、Bruce Maggs 和 Todd Mowry 已教授此课多个学期，他 们给了我们鼓励并帮助改进课程内容。Herb Derby 提供了早期的精神指导和鼓励。Allan Fisher、Garth Gibson、Thomas Gross, Satya、Peter Steenkiste 和 Hui Zhang 从一开始就 鼓励我们开设这门课程。Garth 早期给的建议促使本书的工作得以开展，并且在 Allan Fisher 领导的小组的帮助下又细化和修订了本书的工作。Mark Stehlik 和 Peter Lee 提供 了极大的支持，使得这些内容成为本科生课程的一部分。Greg Kesden 针对 ICS 在操作系 统课程上的影响提供了有益的反馈意见。Greg Ganger 和 Jiri Schindler 提供了一些磁盘驱 动的描述说明，并回答了我们关于现代磁盘的疑问。Tom Striker 向我们展示了存储器山 的比喻。James Hoe 在处理器体系结构方面提出了很多有用的建议和反馈。
          - paragraph [ref=e254]: 有一群特殊的学生极大地帮助我们发展了这门课程的内容，他们是 Khalil Amiri、 Angela Demke Brown、Chris Colohan、Jason Crawford、Peter Dinda、Julio Lopez、 Bruce Lowekamp、Jeff Pierce、 Sanjay Rao、Balaji Sarpeshkar、Blake Scholl、Sanjit Ses- hia、Greg Steffan、Tiankai Tu、Kip Walker 和 Yinglian Xie。尤其是 Chris Colohan建立 了愉悦的氛围并持续到今天，还发明了传奇般的“二进制炸弹”，这是一个对教授机器语 言代码和调试概念非常有用的工具。 Chris Bauer、Alan Cox、Peter Dinda、Sandhya Dwarkadis、John Greiner、Bruce Ja- cob、Barry Johnson、Don Heller、Bruce Lowekamp、Greg Morrisett、Brian Noble、 Bobbie Othmer、Bill Pugh、Michael Scott、 Mark Smotherman、Greg Steffan 和 Bob Wier 花费了大量时间阅读此书的早期草稿，并给予我们建议。特别感谢 Peter Dinda（西北大 学）、John Greiner（莱茨大学）、Wei Hsu（明尼苏达大学）、Bruce Lowekamp（威廉&.玛丽 大学）、Bobbie Othmer（明尼苏达大学）、Michael Scott（罗彻斯特大学）和 Bob Wier（落基 山学院）在教学中测试此书的试用版。同样特别感谢他们的学生们！
          - paragraph [ref=e255]: XXV
          - paragraph [ref=e256]: 我们还要感谢 Prentice Hall 出版社的同事。感谢 Marcia Horton、Eric Frank 和Har- old Stone 不懈的支持和远见。Harold 还帮我们提供了对 RISC 和 CISC 处理器体系结构准 确的历史观点。Jerry Ralya 有惊人的见识，并教会了我们很多如何写作的知识。
          - paragraph [ref=e257]: 最后，我们衷心感谢伟大的技术作家 Brian Kernighan 以及后来的 W. Richard Ste- vens，他们向我们证明了技术书籍也能写得如此优美。 谢谢你们所有的人。 Randal E.Bryant David R. O’Hallaron 于匹兹堡，宾夕法尼亚州
          - paragraph [ref=e258]: R andal E. Bryant 1973年于密歇根大学获得学士学位，随即就读于 麻省理工学院研究生院，并在1981 年获计算机科学博士学位。他 在加州理工学院做了三年助教，从1984年至今一直是卡内基-梅隆大学 的教师。这其中有五年的时间，他是计算机科学系主任，有十年的时间 是计算机科学学院院长。他现在是计算机科学学院的院长、教授。他同 时还受邀任职于电子与计算机工程系。
          - paragraph [ref=e259]: 他教授本科生和研究生计算机系统方面的课程近40年。在讲授计算 机体系结构课程多年后，他开始把关注点从如何设计计算机转移到程序 员如何在更好地了解系统的情况下编写出更有效和更可靠的程序。他和 O’Hallaron 教授一起在卡内基-梅隆大学开设了15-213课程“计算机系统 导论”，那便是此书的基础。他还教授一些有关算法、编程、计算机网 络、分布式系统和 VLSI（超大规模集成电路）设计方面的课程。
          - paragraph [ref=e260]: Bryant 教授的主要研究内容是设计软件工具来帮助软件和硬件设计 者验证其系统正确性。其中，包括几种类型的模拟器，以及用数学方法 来证明设计正确性的形式化验证工具。他发表了 150多篇技术论文。包 括 Intel、IBM、Fujitsu 和 Microsoft 在内的主要计算机制造商都使用着他 的研究成果。他还因他的研究获得过数项大奖。其中包括 Semiconductor Research Corporation 颁发的两个发明荣誉奖和一个技术成就奖，ACM颁 发的 Kanellakis 理论与实践奖，还有IEEE 颁发的 W.R.G. Baker 奖、 Emmanuel Piore 奖和 Phil Kaufman奖。他还是ACM 院士、IEEE 院士、 美国国家工程院院士和美国人文与科学研究院院士。
          - paragraph [ref=e261]: David R. O’Hallaron 卡内基-梅隆大学计算机科学和电子与计算机工 程系教授。在弗吉尼亚大学获得计算机科学博士学位，2007~2010年 Intel 匹兹堡实验室主任。
          - paragraph [ref=e262]: 20年来，他教授本科生和研究生计算机系统方面的课程，例如计算机 体系结构、计算机系统导论、并行处理器设计和 Internet 服务。他和 Bry- ant 教授一起在卡内基-梅隆大学开设了作为本书基础的“计算机系统导 论”课程。2004年他获得了卡内基-梅隆大学计算机科学学院颁发的 Her- bert Simon 杰出教学奖，这个奖项的获得者是基于学生的投票产生的。
          - paragraph [ref=e263]: XXVII
          - paragraph [ref=e264]: 0’Hallaron 教授从事计算机系统领域的研究，主要兴趣在于科学计算、数据密集型计算和 虚拟化方面的软件系统。其中最著名的是 Quake 项目，该项目是一群计算机科学家、土木工程 师和地震学家为提高对强烈地震中大地运动的预测能力而开发的。2003年，他同 Quake 项目 中其他成员一起获得了高性能计算领域中的最高国际奖项——Gordon Bell 奖。他目前的工作 重点是自动分级（autograding）概念，即评价其他程序质量的程序。
