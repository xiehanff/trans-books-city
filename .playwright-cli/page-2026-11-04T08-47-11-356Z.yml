              - /url: http://www.hzbook.com
            - text: 电子邮件：hzjsi@hzbook.com 联系电话：（010）88379604
          - paragraph [ref=e115]: 联系地址：北京市西城区百万庄南街1号 邮政编码：100037 HZ BOOKS 华章教育 华章科技图书出版中心
          - paragraph [ref=e116]: 草公司温莉芳女士邀我为即将出版的《Computer Systems:A ~Programmer’s Perspective》第3版的中文译本《深人理解计算机系 统》写个序，出于两方面的考虑，欣然允之。
          - paragraph [ref=e117]: 一是源于我个人的背景和兴趣。我长期从事软件工程和系统软件领 域的研究，对计算机学科的认识可概括为两大方面：计算系统的构建和 基于计算系统的计算技术应用。出于信息时代国家掌握关键核心技术的 重大需求以及我个人专业的本位视角，我一直对系统级技术的研发给予 更多关注，由于这种“偏爱”和研究习惯的养成，以至于自己在面对非本 专业领域问题时，也常常喜欢从“系统观”来看待问题和解决问题。我自 己也和《深入理解计算机系统》有过“亲密接触”。2012年，我还在北京大 学信息科学技术学院院长任上，学院从更好地培养适应新技术、发展具 有系统设计和系统应用能力的计算机专门人才出发，在调查若干国外高 校计算机学科本科生教学体系基础上，决定加强计算机系统能力培养， 在本科生二年级增设了一门系统级课程，即“计算机系统导论”。其时， 学校正在倡导小班课教学模式，这门课也被选为学院的第一个小班课教 学试点。为了体现学院的重视，我亲自担任了这门课的主持人，带领一 个18人组成的“豪华”教学团队负责该课程的教学工作，将学生分成14 个小班，每个小班不超过15人。同时，该课程涉及教师集体备课组合授 课、大班授课基础上的小班课教学和讨论、定期教学会议、学生自主习 题课和实验课等新教学模式的探索，其中一项非常重要的举措就是选用 了卡内基-梅隆大学 Randal E. Bryant 教授和 David R. O’Hallaron 教授编写 的《Computer Systems： A Programmer’s Perspective》（第2版）作为教材。虽 然这门课程我只主持了一次，但对这本教材的印象颇深颇佳。
          - paragraph [ref=e118]: "二是源于我和华章公司已有的良好合作和相互了解。2000年前后， 我先后翻译了华章公司引进（机械工业出版社出版）的 Roger Pressman 编 写的《Software Engineering: A Practitioner’s Approach》—书的第4版和第 5版。其后，在计算机学会软件工程专业委员会和系统软件专业委员会的 诸多学术活动中也和华章公司及温莉芳女士本人有不少合作。近二十年 来，华章公司的编辑们引进出版了大量计算机学科的优秀教材和学术著 作，对国内高校计算机学科的教学改革起到了积极的促进作用，本书的"
          - paragraph [ref=e119]: VI 翻译出版仍是这项工作的延续。这是一项值得褒扬的工作，我也想借此机会代表计算机界同仁 表达对华章公司的感谢！
          - paragraph [ref=e120]: 计算机系统类别的课程一直是计算机科学与技术专业的主要教学内容之一。由于历史原 因，我国的计算机专业的课程体系曾广泛参考 ACM 和IEEE 制订的计算机科学与技术专业教 学计划（Computing Curricula）设计，计算机系统类课程也参照该计划分为汇编语言、操作系统、 组成原理、体系结构、计算机网络等多门课程。应该说，该课程体系在历史上对我国的计算机 专业教育起了很好的引导作用。
          - paragraph [ref=e121]: 进入新世纪以来，计算技术发生了重要的发展和变化，我国的信息技术和产业也得到了迅 猛发展，对计算机专业的毕业生提出了更高要求。重新审视原来我们参照 ACM/IEEE 计算机 专业计划的课程体系，会发现存在以下几个方面的主要问题。 1）课程体系中缺乏一门独立的能够贯穿整个计算机系统的基础课程。计算机系统方面的 基础知识被分成了很多门独立的课程，课程内容彼此之间缺乏关联和系统性。学生学习之后， 虽然在计算机系统的各个部分理解了很多概念和方法，但往往会忽视各个部分之间的关联，难 以系统性地理解整个计算机系统的工作原理和方法。 2）现有课程往往偏重理论，和实践关联较少。如现有的系统课程中通常会介绍函数调用 过程中的压栈和退栈方式，但较少和实践关联来理解压栈和退栈过程的主要作用。实际上，压 栈和退栈与理解C等高级语言的工作原理息息相关，也是常用的攻击手段 Buffer Overflow 的 主要技术基础。 3）教学内容比较传统和陈旧，基本上是早期PC 时代的内容。比如，现在的主流台式机 CPU 都已经是x86-64 指令集，但较多课程还在教授80386 甚至更早的指令集。对于近年来出 现的多核/众核处理器、SSD 硬盘等实际应用中遇到的内容更是涉及较少。 4）课程大多数从设计者的角度出发，而不是从使用者的角度出发。对于大多数学生来说， 毕业之后并不会成为专业的CPU设计人员、操作系统开发人员等，而是会成为软件开发工程 师。对他们而言，最重要的是理解主流计算机系统的整体设计以及这些设计因素对于应用软件 开发和运行的影响。
          - paragraph [ref=e122]: 这本教材很好地克服了上述传统课程的不足，这也是当初北大计算机学科本科生教学改革 时选择该教材的主要考量。其一，该教材系统地介绍了整个计算机系统的工作原理，可帮助学 生系统性地理解计算机如何执行程序、存储信息和通信；其二，该教材非常强调实践，全书包 括9个配套的实验，在这些实验中，学生需要攻破计算机系统、设计CPU、实现命令行解释 器、根据缓存优化程序等，在新鲜有趣的实验中理解系统原理，培养动手能力；其三，该教材 紧跟时代的发展，加入了 x86-64 指令集、Intel Core i7 的虚拟地址结构、SSD 磁盘、IPv6 等新 技术内容；其四，该教材从程序员的角度看待计算机系统，重点讨论系统的不同结构对于上层
          - paragraph [ref=e123]: VII 应用软件编写、执行和数据存储的影响，以培养程序员在更广阔空间应用计算机系统知识的 能力。
          - paragraph [ref=e124]: 基于该教材的北大“计算机系统导论”课程实施已有五年，得到了学生的广泛赞誉，学生们 通过这门课程的学习建立了完整的计算机系统的知识体系和整体知识框架，养成了良好的编程 习惯并获得了编写高性能、可移植和健壮的程序的能力，奠定了后续学习操作系统、编译、计 算机体系结构等专业课程的基础。北大的教学实践表明，这是一本值得推荐采用的好教材。
          - paragraph [ref=e125]: 该书的第3版相对于第2版进行了较大程度的修改和扩充。第3版从一开始就采用最新 x86-64 架构来贯穿各部分知识，在内存技术、网络技术上也有一系列更新，并且重组了之前的 一些比较难懂的内容。我相信，该书的出版，将有助于国内计算机系统教学的进一步改进，为 培养从事系统级创新的计算机人才奠定很好的基础。 2016年10月8日
          - paragraph [ref=e126]: "2"
          - paragraph [ref=e127]: 002年8月本书第1版首次印刷。一个月之后，我在复旦大学软件学
          - paragraph [ref=e128]: 院开设了“计算机系统基础”课程，成为国内第一个采用这本教材授 课的老师。这本教材有四个特点。第一，涉及面广，覆盖了二进制、汇 编、组成、体系结构、操作系统、网络与并发程序设计等计算机系统最 重要的方面。第二，具有相当的深度，本书从程序出发逐步深入到系统 领域的重要问题，而非点到为止，学完本书后读者可以很好地理解计算 机系统的工作原理。第三，它是面向低年级学生的教材，在过去的教学 体系中这本书所涉及的很多内容只能在高年级讲授，而本书通过合理的 安排将计算机系统领域最核心的内容巧妙地展现给学生（例如，不需要掌 握逻辑设计与硬件描述语言的完整知识，就可以体验处理器设计）。第 四，本书配备了非常实用、有趣的实验。例如，模仿硬件仅用位操作完 成复杂的运算，模仿 tracker 和 hacker 去破解密码以及攻击自身的程序， 设计处理器，实现简单但功能强大的 Shell 和 Proxy 等。这些实验既强化 了学生对书本知识的理解，也进一步激发了学生探究计算机系统的热情。
          - paragraph [ref=e129]: 以低年级开设“深入理解计算机系统”课程为基础，我先后在复旦大 学和上海交通大学软件学院主导了激进的教学改革。必修课时被大量压 缩，现在软件工程专业必修课由问题求解、计算机系统基础、应用开发 基础、软件工程四个模块9门课构成。其他传统的必修课如操作系统、 编译原理、数字逻辑等都成为方向课。课程体系的变化，减少了学生修 读课程的总数和总课时，因而为大幅度增加实验总量、提高实验难度和 强度、增强实验的综合性和创新性提供了有力保障。现在我的课题组的 青年教师全部是首批经历此项教学改革的学生。本科的扎实基础为他们 从事系统软件研究打下了良好基础，他们实现了亚洲学术界在操作系统 旗舰会议 SOSP上论文发表零的突破，目前研究成果在国际上具有较大 的影响力。师资力量的补充，又为全面推进更加激进的教学改革创造了 条件。
          - paragraph [ref=e130]: 本书的出版标志着国际上计算机教学进入了第三阶段。从历史来看， 国际上计算机教学先后经历了三个主要阶段。第一阶段是上世纪70年代 中期至80年代中期，那时理论、技术还不成熟，系统不稳定，因此教材 主要围绕若干重要问题讲授不同流派的观点，学生解决实际问题的能力
          - paragraph [ref=e131]: IX 不强。第二阶段是上世纪80年代中期至本世纪初，当时计算机单机系统的理论和技术已逐步 趋于成熟，主流系统稳定，因此教材主要围绕主流系统讲解理论和技术，学生的理论基础扎 实，动手能力强。第三阶段从本世纪初开始，主要背景是随着互联网的兴起，信息技术开始渗 透到人类工作和生活的方方面面。技术爆炸迫使教学者必须重构传统的以计算机单机系统为主 导的课程体系。新的体系大面积调整了核心课程的内容。核心课程承担了帮助学生构建专业知 识框架的任务，为学生在毕业后相当长时间内的专业发展奠定坚实基础。现在一般认为问题抽 象、系统抽象和数据抽象是计算机类专业毕业生的核心能力。而本书担负起了系统抽象的重 任，因此美国的很多高校都采用了该书作为计算机系统核心课程的教材。第三阶段的教材与第 二阶段的教材是互补关系。第三阶段的教材主要强调坚实而宽广的基础，第二阶段的教材主要 强调深人系统的专门知识，因此依然在本科高年级方向课和研究生专业课中占据重要地位。
          - paragraph [ref=e132]: 上世纪80年代初，我国借鉴美国经验建立了自己的计算机教学体系并引进了大量教材。 从21 世纪初开始，一些学校开始借鉴美国第二阶段的教学方法，采用了部分第二阶段的著名 教材，这些改革正在走向成熟并得以推广。2012年北京大学计算机专业采用本书作为教材后， 采用本教材开设“计算机系统基础”课程的高校快速增加。以此为契机，国内的计算机教学也有 望全面进入第三阶段。
          - paragraph [ref=e133]: 本书的第3版完全按照x86-64 系统进行改写。此外，第2版中删除了以 x87 呈现的浮点指 令，在第3版中浮点指令又以标量 AVX2 的形式得以复。第3版更加强调并发，增加了较大 篇幅用于讨论信号处理程序与主程序间并发时的正确性保障。总体而言，本书的三个版本在结 构上没有太大变化，不同版本的出现主要是为了在细节上能够更好地反映技术的最新变化。
          - paragraph [ref=e134]: 当然本书的某些部分对于初学者而言还是有些难以阅读。本书涉及大量重要概念，但一些 概念首次亮相时并没有编排好顺序。例如寄存器的概念、汇编指令的顺序执行模式、PC 的概 念等对于初学者而言非常陌生，但这些介绍仅仅出现在第1章的总览中，而当第3章介绍汇编 时完全没有进一步的展开就假设读者已经非常清楚这些概念。事实上这些概念原本就介绍得过 于简单，短暂亮相之后又立即退场，相隔较长时间后，当这些概念再次登场时，初学者早已忘 却了它们是什么。同样，第8章对进程、并发等概念的介绍也存在类似问题。因此，中文翻译 版将配备导读部分，希望这些导读能够帮助初学者顺利阅读。 藏斌兮 2016年10月15日
          - paragraph [ref=e135]: 本 、书第1版出版于2003年，第2版出版于2011年，去年发行的已 ～经是原书第3版了。第3版还是采用以下组合方式：在经典的 x86 架构机器上运行 Linux 操作系统，采用C语言编程。这样的组合经受 住了时间的考验。这一版的一个明显变化就是从讲解IA32 和 x86-64 转变 为完全以 x86-64为基础，相应地修改了第3、4、5、6和7章。同时，还 改写了第2章，使之更易读、好懂；用近期的新技术更新了第6、11 和 12章。这些变化使得本书既和新技术保持了同步，又保留了描述系统本 质的内容以及从程序员角度出发的特色。
          - paragraph [ref=e136]: 除了翻译本书，我们也开始以本书为教材讲授“计算机系统基础”课 程，对这本书的理解也随之越来越深入，意识到除了阅读之外，动手实 践更是学习计算机系统的必经之路。本书的官网提供了很多实验作业 （Lab Assignment），其中不乏有趣且有一定难度的实验，比如 Bomb Lab。 有兴趣的读者除了阅读本书的内容之外，还应该试着去完成这些实验， 让纸面上的内容在实际动手中得到巩固和加强。本书的官方博客也不断 更新着有关这本书和配套课程的最新变化，这也是对本书的有益补充。
          - paragraph [ref=e137]: 第3版从翻译的角度来说，我们尽量做到更流畅，更符合中文表达 的习惯。对于一些术语，比如 memory，以前怕出错就统一翻译成存储 器，现在则尽可能地按照语境去区分，翻译成内存或者存储器。
          - paragraph [ref=e138]: 在此，要感谢本书的编辑朱劼、姚蕾以及和静，有她们的支持、鼓 励和耐心细致的工作，才能让本书如期与读者见面。
          - paragraph [ref=e139]: 由于本书内容多，翻译时间紧迫，尽管我们尽量做到认真仔细，但 还是难以避免出现错误和不尽如人意的地方。在此欢迎广大读者批评指 正。我们也会一如既往地维护勘误表，及时在网上更新，方便大家阅读。 （另外，本版第1次印刷时，我们已经根据官网2016年3月1日前发布的 勘误进行了修正，就不在中文勘误中再翻译了。） 龚奕利贺莲 2016年5月于珞珈山
          - paragraph [ref=e140]: 本 、书（简称 CS:APP）的主要读者是计算机科学家、计算机工程师，以及 那些想通过学习计算机系统的内在运作而能够写出更好程序的人。
          - paragraph [ref=e141]: 我们的目的是解释所有计算机系统的本质概念，并向你展示这些概 念是如何实实在在地影响应用程序的正确性、性能和实用性的。其他的 系统类书籍都是从构建者的角度来写的，讲述如何实现硬件或系统软件， 包括操作系统、编译器和网络接口。而本书是从程序员的角度来写的， 讲述应用程序员如何能够利用系统知识来编写出更好的程序。当然，学 习一个计算机系统应该做些什么，是学习如何构建一个计算机系统的很 好的出发点，所以，对于希望继续学习系统软硬件实现的人来说，本书 也是一本很有价值的介绍性读物。大多数系统书籍还倾向于重点关注系 统的某一个方面，比如：硬件架构、操作系统、编译器或者网络。本书 则以程序员的视角统一覆盖了上述所有方面的内容。
          - paragraph [ref=e142]: 如果你研究和领会了这本书里的概念，你将开始成为极少数的“牛 人”，这些“牛人”知道事情是如何运作的，也知道当事情出现故障时如 何修复。你写的程序将能够更好地利用操作系统和系统软件提供的功能， 对各种操作条件和运行时参数都能正确操作，运行起来更快，并能避免出 现使程序容易受到网络攻击的缺陷。同时，你也要做好更深入探究的准备， 研究像编译器、计算机体系结构、操作系统、嵌入式系统、网络互联和网络 安全这样的高级题目。 读者应具备的背景知识
          - paragraph [ref=e143]: 本书的重点是执行x86-64 机器代码的系统。对英特尔及其竞争对手而 言，x86-64 是他们自1978年起，以8086 微处理器为代表，不断进化的最新 成果。按照英特尔微处理器产品线的命名规则，这类微处理器俗称为“x86”。 随着半导体技术的演进，单芯片上集成了更多的晶体管，这些处理器的计算 能力和内存容量有了很大的增长。在这个过程中，它们从处理16位字，发展 到引入 IA32处理器处理32位字，再到最近的x86-64 处理64位字。
          - paragraph [ref=e144]: 我们考虑的是这些机器如何在 Linux 操作系统上运行C语言程序。 Linux 是众多继承自最初由贝尔实验室开发的 Unix 的操作系统中的一种。 这类操作系统的其他成员包括 Solaris、FreeBSD 和 MacOS X。近年来，
          - paragraph [ref=e145]: XII 由于 Posix 和标准 Unix 规范的标准化努力，这些操作系统保持了高度兼容性。因此，本书内 容几乎直接适用于这些“类 Unix”操作系统。
          - paragraph [ref=e146]: 文中包含大量已在 Linux 系统上编译和运行过的程序示例。我们假设你能访问一台这样的 机器，并且能够登录，做一些诸如切换目录之类的简单操作。如果你的计算机运行的是Mi- crosoft Windows 系统，我们建议你选择安装一个虚拟机环境（例如 VirtualBox 或者 VMWare）， 以便为一种操作系统（客户OS）编写的程序能在另一种系统（宿主 OS）上运行。
          - paragraph [ref=e147]: 我们还假设你对C和C++有一定的了解。如果你以前只有Java 经验，那么你需要付出更 多的努力来完成这种转换，不过我们也会帮助你。Java 和C有相似的语法和控制语句。不过， 有一些C语言的特性（特别是指针、显式的动态内存分配和格式化 I/O）在Java 中都是没有的。 所幸的是，C是一个较小的语言，在 Brian Kernighan 和 Dennis Ritchie 经典的“K& R”文献中 得到了清晰优美的描述［61］。无论你的编程背景如何，都应该考虑将 K& R 作为个人系统藏书 的一部分。如果你只有使用解释性语言的经验，如Python、Ruby 或 Perl，那么在使用本书之 前，需要花费一些时间来学习 C。
          - paragraph [ref=e148]: 本书的前几章揭示了C语言程序和它们相对应的机器语言程序之间的交互作用。机器语言 示例都是用运行在x86-64处理器上的GNU GCC编译器生成的。我们不需要你以前有任何硬 件、机器语言或是汇编语言编程的经验。 给C语言初学者 关于C编程语言的建议 为了帮助C语言编程背景薄弱（或全无背景）的读者，我们在书中加入了这样一些专门的 注释来突出C中一些特别重要的特性。我们假设你熟悉C++或Java。 如何阅读此书
          - paragraph [ref=e149]: 从程序员的角度学习计算机系统是如何工作的会非常有趣，主要是因为你可以主动地做这 件事情。无论何时你学到一些新的东西，都可以马上试验并且直接看到运行结果。事实上，我 们相信学习系统的唯一方法就是做（do）系统，即在真正的系统上解决具体的问题，或是编写和 运行程序。
          - paragraph [ref=e150]: 这个主题观念贯穿全书。当引人一个新概念时，将会有一个或多个练习题紧随其后，你应 该马上做一做来检验你的理解。这些练习题的解答在每章的末尾。当你阅读时，尝试自己来解 答每个问题，然后再查阅答案，看自己的答案是否正确。除第1章外，每章后面都有难度不同 的家庭作业。对每个家庭作业题，我们标注了难度级别：
