          - paragraph [ref=f4e1186]: 量后，我们把运行时间降到了大部分时间是花在 strlen上，而大多数对 strlen的 调用是作为小写字母转换的一部分。我们已经看到了函数1ower1 有二次的性能，特别是 对长字符串来说。这篇文档中的单词足够短，能避免二次性能的灾难性的结果；最长的 bigram 只有32个字符。不过换成使用1ower2，显示为“Linear Lower”得到很好的性 能，整个时间降到了0.2秒。
          - paragraph [ref=f4e1187]: 通过这个练习，我们展示了代码剖析能够帮助将一个简单应用程序所需的时间从3.5 分钟降低到0.2秒，得到的性能提升约1000倍。剖析程序帮助我们把注意力集中在程 序最耗时的部分上，同时还提供了关于过程调用结构的有用信息。代码中的一些瓶颈，例 如二次的排序函数，很容易看出来；而其他的，例如插人到链表的开始还是结尾，只有通 过仔细的分析才能看出。
          - paragraph [ref=f4e1188]: 我们可以看到，剖析是工具箱中一个很有用的工具，但是它不应该是唯一一个。计时测 量不是很准确，特别是对较短的运行时间（小于1秒）来说。更重要的是，结果只适用于被测 试的那些特殊的数据。例如，如果在由较少数量的较长字符串组成的数据上运行最初的函 数，我们会发现小写字母转换函数才是主要的性能瓶颈。更糟糕的是，如果它只剖析包含短 单词的文档，我们可能永远不会发现隐藏着的性能瓶颈，例如 1ower1 的二次性能。通常， 假设在有代表性的数据上运行程序，剖析能帮助我们对典型的情况进行优化，但是我们还应 该确保对所有可能的情况，程序都有相当的性能。这主要包括避免得到糟糕的渐近性能（as- ymptotic performance）的算法（例如插入算法）和坏的编程实践（例如 lower1）。 1.9.1中讨论了 Amdabl定律，它为通过有针对性的优化来获取性能提升提供了一些 其他的见解。对于 n-gram 代码来说，当用 quicksort 代替了插人排序后，我们看到总的执 行时间从209.0秒下降到5.4秒。初始版本的209.0秒中的203.7秒用于执行插入排序， 得到a=0.974，被此次优化加速的时间比例。使用 quicksort，花在排序上的时间变得微 不足道，得到预计的加速比为 209/a=39.0，接近于测量加速比38.5。我们之所以能获得 大的加速比，是因为排序在整个执行时间中占了非常大的比例。然而，当一个瓶颈消除， 而新的瓶颈出现时，就需要关注程序的其他部分以获得更多的加速比。 5.15 小结 虽然关于代码优化的大多数论述都描述了编译器是如何能生成高效代码的，但是应用程序员有很多方 法来协助编译器完成这项任务。没有任何编译器能用一个好的算法或数据结构代替低效率的算法或数据结 构，因此程序设计的这些方面仍然应该是程序员主要关心的。我们还看到妨碍优化的因素，例如内存别名 使用和过程调用，严重限制了编译器执行大量优化的能力。同样，程序员必须对消除这些妨碍优化的因素 负主要的责任。这些应该被看作好的编程习惯的一部分，因为它们可以用来消除不必要的工作。
          - paragraph [ref=f4e1189]: 第5草 优化程序性能 393
          - paragraph [ref=f4e1190]: 基本级别之外调整性能需要一些对处理器微体系结构的理解，描述处理器用来实现它的指令集体系 结构的底层机制。对于乱序处理器的情况，只需要知道一些关于操作、容量、延迟和功能单元发射时间 的信息，就能够基本地预测程序的性能了。
          - paragraph [ref=f4e1191]: 我们研究了一系列技术，包括循环展开、创建多个累积变量和重新结合，它们可以利用现代处理器 提供的指令级并行。随着对优化的深入，研究产生的汇编代码以及试着理解机器如何执行计算变得重要 起来。确认由程序中的数据相关决定的关键路径，尤其是循环的不同迭代之间的数据相关，会收获良多。 我们还可以根据必须要计算的操作数量以及执行这些操作的功能单元的数量和发射时间，计算一个计算 的吞吐量界限。
          - paragraph [ref=f4e1192]: 包含条件分支或与内存系统复杂交互的程序，比我们最开始考虑的简单循环程序，更难以分析和优 化。基本策略是使分支更容易预测，或者使它们很容易用条件数据传送来实现。我们还必须注意存储和 加载操作。将数值保存在局部变量中，使得它们可以存放在寄存器中，这会很有帮助。
          - paragraph [ref=f4e1193]: 当处理大型程序时，将注意力集中在最耗时的部分变得很重要。代码剖析程序和相关的工具能帮助 我们系统地评价和改进程序性能。我们描述了 GPROF，一个标准的Unix 剖析工具。还有更加复杂完善 的剖析程序可用，例如 Intel 的 VTUNE 程序开发系统，还有 Linux 系统基本上都有的 VALGRIND。这 些工具可以在过程级分解执行时间，估计程序每个基本块（basic block）的性能。（基本块是内部没有控制 转移的指令序列，因此基本块总是整个被执行的。） 参考文献说明
          - paragraph [ref=f4e1194]: 我们的关注点是从程序员的角度描述代码优化，展示如何使书写的代码能够使编译器更容易地产生 高效的代码。Chellappa、Franchetti 和 Puschel 的扩展的论文［19］采用了类似的方法，但关于处理器的特 性描述得更详细。
          - paragraph [ref=f4e1195]: 有许多著作从编译器的角度描述了代码优化，形式化描述了编辑器可以产生更有效代码的方法。 Muchnick 的著作被认为是最全面的［80］。Wadleigh 和Crawford 的关于软件优化的著作［115］覆盖了一些 我们已经谈到的内容，不过它还描述了在并行机器上获得高性能的过程。Mahlke 等人的一篇比较早期的 论文［75］，描述了几种为编译器开发的将程序映射到并行机器上的技术，它们是如何能够被改造成利用 现代处理器的指令级并行的。这篇论文覆盖了我们讲过的代码变换，包括循环展开、多个累积变量（他们 称之为累积变量扩展（accumulator variable expansion））和重新结合（他们称之为树高度减少（tree height reduction））。
