          - paragraph [ref=f1e99]: 第2章 信息的表示和处理 29 2.1.3 寻址和字节顺序 对于跨越多字节的程序对象，我们必须建立两个规则：这个对象的地址是什么，以及 在内存中如何排列这些字节。在几乎所有的机器上，多字节对象都被存储为连续的字节序 列，对象的地址为所使用字节中最小的地址。例如，假设一个类型为 int 的变量x的地址 为0x100，也就是说，地址表达式&x 的值为Ox100。那么，（假设数据类型 int 为32位表 示）x的4个字节将被存储在内存的Ox100、0x101、0x102和 Ox103位置。
          - paragraph [ref=f1e100]: 排列表示一个对象的字节有两个通用的规则。考虑一个w 位的整数，其位表示为［x-，
          - paragraph [ref=f1e101]: ⋯，X1，z0］，其中zw-是最高有效位，而z。是最低有效位。假设w是8的倍数，这 些位就能被分组成为字节，其中最高有效字节包含位［zw 1，Xw-2，⋯，w-8］，而最低有效 字节包含位［z7，26，⋯，20］，其他字节包含中间的位。某些机器选择在内存中按照从最低 有效字节到最高有效字节的顺序存储对象，而另一些机器则按照从最高有效字节到最低有效 字节的顺序存储。前一种规则——最低有效字节在最前面的方式，称为小端法（little endian）。 后一种规则——最高有效字节在最前面的方式，称为大端法（big endian）。
