          - paragraph [ref=f1e534]: 因为表示方法限制了浮点数的范围和精度，所以浮点运算只能近似地表示实数运算。 因此，对于值z，我们一般想用一种系统的方法，能够找到“最接近的”匹配值x，它可 以用期望的浮点形式表示出来。这就是舍入（rounding）运算的任务。一个关键问题是在两 个可能值的中间确定舍入方向。例如，如果我有1.50美元，想把它舍人到最接近的美元 数，应该是1美元还是2美元呢？一种可选择的方法是维持实际数字的下界和上界。例 如，我们可以确定可表示的值 和z*，使得 的值位于它们之间： ≤ ≤ 。IEEE 浮点格式定义了四种不同的舍入方式。默认的方法是找到最接近的匹配，而其他三种可用 于计算上界和下界。 图2-37举例说明了四种舍人方式，将一个金额数舍入到最接近的整数美元数。向偶 数入（round-to-even），也被称为向最接近的值舍入（round-to-nearest），是默认的方式， 试图找到一个最接近的匹配值。因此，它将 1.40美元舍入成1美元，而将 1.60美元舍入 成2美元，因为它们是最接近的整数美元值。唯一的设计决策是确定两个可能结果中间数 值的舍人效果。向偶数舍入方式采用的方法是：它将数字向上或者向下舍入，使得结果的 最低有效数字是偶数。因此，这种方法将1.5美元和2.5美元都舍人成2美元。 方式 1.40 1.60 1.50 2.50 向偶数舍入 2 2 2 向零合人 1 向下舍入 向上合入 2 2 1 2 3 -1.50 -2 -1 -2 -1 图 2-37 以美元舍入为例说明舍人方式（第一种方法是舍人到一个最接近的值， 而其他三种方法向上或向下限定结果，单位美元）
          - paragraph [ref=f1e535]: 其他三种方式产生实际值的确界（guaranteed bound）。这些方法在一些数字应用中是 很有用的。向零舍人方式把正数向下舍人，把负数向上舍人，得到值全，使得|2|≤Izl。 向下舍人方式把正数和负数都向下舍人，得到值z，使得z≤z。向上舍人方式把正数 和负数都向上舍入，得到值x*，满足x≤ *
          - paragraph [ref=f1e536]: 向偶数舍人初看上去好像是个相当随意的目标—有什么理由偏向取偶数呢？为什么 不始终把位于两个可表示的值中间的值都向上舍入呢？使用这种方法的一个问题就是很容 易假想到这样的情景：这种方法舍人一组数值，会在计算这些值的平均数中引入统计偏 差。我们采用这种方式舍入得到的一组数的平均值将比这些数本身的平均值略高一些。相 反，如果我们总是把两个可表示值中间的数字向下舍入，那么舍人后的一组数的平均值将 比这些数本身的平均值略低一些。向偶数舍人在大多数现实情况中避免了这种统计偏差。
          - paragraph [ref=f1e537]: 84 第一部分 程序结构和执行 在50%的时间里，它将向上舍人，而在50%的时间里，它将向下舍人。
          - paragraph [ref=f1e538]: 在我们不想舍人到整数时，也可以使用向偶数舍人。我们只是简单地考虑最低有效数 字是奇数还是偶数。例如，假设我们想将十进制数舍入到最接近的百分位。不管用那种舍 人方式，我们都将把1.2349999舍人到1.23，而将1.2350001 舍人到1.24，因为它们不 是在1.23和1.24的正中间。另一方面我们将把两个数1.2350000 和 1.2450000 都舍人到 1.24，因为4是偶数。 相似地，向偶数舍人法能够运用在二进制小数上。我们将最低有效位的值0认为是偶 数，值1认为是奇数。一般来说，只有对形如 XX•••X.YY•••Y100⋯的二进制位模式的数， 这种舍人方式才有效，其中X和Y表示任意位值，最右边的Y是要被舍人的位置。只有 这种位模式表示在两个可能的结果正中间的值。例如，考虑舍人值到最近的四分之一的问 题（也就是二进制小数点右边2位）。我们将 10.00011：（2 录）向下舍人到 10.00：（2）， 10.00110（2）向上舍人到10.012（2一），因为这些值不是两个可能值的正中间值。我们将 10.11100：（2 ）向上舍人成11.00：（3），而10.10100：（2号）向下舍人成10.10：（2号） 因为 这些值是两个可能值的中间值，并且我们倾向于使最低有效位为零。
