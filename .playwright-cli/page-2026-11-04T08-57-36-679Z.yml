          - paragraph [ref=f4e1003]: 使用了这最后的变换，至此，对于每个元素的计算，都只需要1.25~5个时钟周期。 比起最开始采用优化时的9～11个周期，这是相当大的提高了。现在我们想看看是什么因 素在制约着代码的性能，以及可以如何进一步提高。 5.7 理解现代处理器 到目前为止，我们运用的优化都不依赖于目标机器的任何特性。这些优化只是简单 地降低了过程调用的开销，以及消除了一些重大的“妨碍优化的因素”，这些因素会给 优化编译器造成困难。随着试图进一步提高性能，必须考虑利用处理器徽体系结构的优 化，也就是处理器用来执行指令的底层系统设计。要想充分提高性能，需要仔细分析程 序，同时代码的生成也要针对目标处理器进行调整。尽管如此，我们还是能够运用一些 基本的优化，在很大一类处理器上产生整体的性能提高。我们在这里公布的详细性能结 果，对其他机器不一定有同样的效果，但是操作和优化的通用原则对各种各样的机器都 适用。
          - paragraph [ref=f4e1004]: 为了理解改进性能的方法，我们需要理解现代处理器的微体系结构。由于大量的晶 体管可以被集成到一块芯片上，现代微处理器采用了复杂的硬件，试图使程序性能最大 化。带来的一个后果就是处理器的实际操作与通过观察机器级程序所察觉到的大相径 庭。在代码级上，看上去似乎是一次执行一条指令，每条指令都包括从寄存器或内存取 值，执行一个操作，并把结果存回到一个寄存器或内存位置。在实际的处理器中，是同时 对多条指令求值的，这个现象称为指令级并行。在某些设计中，可以有100或更多条指令 在处理中。采用一些精细的机制来确保这种并行执行的行为，正好能获得机器级程序要求 的顺序语义模型的效果。现代微处理器取得的了不起的功绩之一是：它们采用复杂而奇异 的微处理器结构，其中，多条指令可以并行地执行，同时又呈现出一种简单的顺序执行指 令的表象。
          - paragraph [ref=f4e1005]: 虽然现代微处理器的详细设计超出了本书讲授的范围，对这些微处理器运行的原则有 一般性的了解就足够能够理解它们如何实现指令级并行。我们会发现两种下界描述了程序 的最大性能。当一系列操作必须按照严格顺序执行时，就会遇到延迟界限（latency bound），因为在下一条指令开始之前，这条指令必须结束。当代码中的数据相关限制了处 理器利用指令级并行的能力时，延迟界限能够限制程序性能。吞吐量界限（throughput bound）刻画了处理器功能单元的原始计算能力。这个界限是程序性能的终极限制。 5.7.1 整体操作 图5-11是现代微处理器的一个非常简单化的示意图。我们假想的处理器设计是不太 严格地基于近期的Intel 处理器的结构。这些处理器在工业界称为超标量（superscalar）， 意思是它可以在每个时钟周期执行多个操作，而且是乱序的（out-of-order），意思就是指令 执行的顺序不一定要与它们在机器级程序中的顺序一致。整个设计有两个主要部分：指令 控制单元 （Instruction Control Unit, ICU）和执行单元（Execution Unit, EU）。前者负责 从内存中读出指令序列，并根据这些指令序列生成一组针对程序数据的基本操作；而后者 执行这些操作。和第4章中研究过的按序（in-order）流水线相比，乱序处理器需要更大、 更复杂的硬件，但是它们能更好地达到更高的指令级并行度。
          - paragraph [ref=f4e1006]: 358 第一部分 程序结构和执行 退役单元 寄存器 文件 指令控制单元 取指 控制 指令 译码 操作 地址 指令 指令高 速缓存 寄存器 更新 ：预测OK？ 分支 算术运算 算术运算 加载 存储 功能 单元 操作结果 地址 图 5-11 一个乱序处理器的框图。指令控制单元负责从内存中读出指令，并产生一系列基本操 作。然后执行单元完成这些操作，以及指出分支预测是否正确
          - paragraph [ref=f4e1007]: ICU 从指令高速缓存（instruction cache）中读取指令，指令高速缓存是一个特殊的高 速存储器，它包含最近访问的指令。通常，ICU 会在当前正在执行的指令很早之前取指， 这样它才有足够的时间对指令译码，并把操作发送到 EU。不过，一个问题是当程序遇到 分支时，程序有两个可能的前进方向。一种可能会选择分支，控制被传递到分支目标。 另一种可能是，不选择分支，控制被传递到指令序列的下一条指令。现代处理器采用了一 种称为分支预测（branch prediction）的技术，处理器会猜测是否会选择分支，同时还预测 分支的目标地址。使用投机执行（speculative execution）的技术，处理器会开始取出位于它 预测的分支会跳到的地方的指令，并对指令译码，甚至在它确定分支预测是否正确之前就 开始执行这些操作。如果过后确定分支预测错误，会将状态重新设置到分支点的状态，并 开始取出和执行另一个方向上的指令。标记为取指控制的块包括分支预测，以完成确定取 哪些指令的任务。
          - paragraph [ref=f4e1008]: 指令译码逻辑接收实际的程序指令，并将它们转换成一组基本操作（有时称为微操作）。 每个这样的操作都完成某个简单的计算任务，例如两个数相加，从内存中读数据，或是向内 存写数据。对于具有复杂指令的机器，比如x86处理器，一条指令可以被译码成多个操作。 关于指令如何被译码成操作序列的细节，不同的机器都会不同，这个信息可谓是高度机密。 幸运的是，不需要知道某台机器实现的底层细节，我们也能优化自己的程序。 ① 术语“分支”专指条件转移指令。对处理器来说，其他可能将控制传送到多个目的地址的指令，例如过程 返回和间接跳转，带来的也是类似的挑战。
          - paragraph [ref=f4e1009]: 第5章 优化程序性能 359
          - paragraph [ref=f4e1010]: 在一个典型的x86实现中，一条只对寄存器操作的指令，例如 addq %rax，%rdx 会被转化成一个操作。另一方面，一条包括一个或者多个内存引用的指令，例如 addq %rax,8（%rdx） 会产生多个操作，把内存引用和算术运算分开。这条指令会被译码成三个操作：一个操 作从内存中加载一个值到处理器中，一个操作将加载进来的值加上寄存器%rax 中的值， 而一个操作将结果存回到内存。这种译码逻辑对指令进行分解，允许任务在一组专门的硬 件单元之间进行分割。这些单元可以并行地执行多条指令的不同部分。
          - paragraph [ref=f4e1011]: EU 接收来自取指单元的操作。通常，每个时钟周期会接收多个操作。这些操作会被 分派到一组功能单元中，它们会执行实际的操作。这些功能单元专门用来处理不同类型的 操作。
          - paragraph [ref=f4e1012]: 读写内存是由加载和存储单元实现的。加载单元处理从内存读数据到处理器的操作。 这个单元有一个加法器来完成地址计算。类似，存储单元处理从处理器写数据到内存的操 作。它也有一个加法器来完成地址计算。如图中所示，加载和存储单元通过数据高速缓存 （data cache）来访问内存。数据高速缓存是一个高速存储器，存放着最近访问的数据值。
          - paragraph [ref=f4e1013]: 使用投机执行技术对操作求值，但是最终结果不会存放在程序寄存器或数据内存中， 直到处理器能确定应该实际执行这些指令。分支操作被送到 EU，不是确定分支该往哪里 去，而是确定分支预测是否正确。如果预测错误，EU 会丢弃分支点之后计算出来的结果。 它还会发信号给分支单元，说预测是错误的，并指出正确的分支目的。在这种情况中，分 支单元开始在新的位置取指。如在3.6.6节中看到的，这样的预测错误会导致很大的性能 开销。在可以取出新指令、译码和发送到执行单元之前，要花费一点时间。 图5-11说明不同的功能单元被设计来执行不同的操作。那些标记为执行“算术运算” 的单元通常是专门用来执行整数和浮点数操作的不同组合。随着时间的推移，在单个微处 理器芯片上能够集成的晶体管数量越来越多，后续的微处理器型号都增加了功能单元的数 量以及每个单元能执行的操作组合，还提升了每个单元的性能。由于不同程序间所要求的 操作变化很大，因此，算术运算单元被特意设计成能够执行各种不同的操作。比如，有些 程序也许会涉及整数操作，而其他则要求许多浮点操作。如果一个功能单元专门执行整数 操作，而另一个只能执行浮点操作，那么，这些程序就没有一个能够完全得到多个功能单 元带来的好处了。
          - paragraph [ref=f4e1014]: 举个例子，我们的 Intel Core i7 Haswell 参考机有8个功能单元，编号为0～7。下面 部分列出了每个单元的功能：
          - paragraph [ref=f4e1015]: 0：整数运算、浮点乘、整数和浮点数除法、分支
          - paragraph [ref=f4e1016]: 1：整数运算、浮点加、整数乘、浮点乘 2：加载、地址计算 3：加载、地址计算 4：存储 5：整数运算 6：整数运算、分支 7：存储、地址计算
          - paragraph [ref=f4e1017]: 在上面的列表中，“整数运算”是指基本的操作，比如加法、位级操作和移位。乘法
          - paragraph [ref=f4e1018]: 360 第一部分 程序结构和执行 和除法需要更多的专用资源。我们看到存储操作要两个功能单元—一个计算存储地址， 一个实际保存数据。5.12节将讨论存储（和加载）操作的机制。
          - paragraph [ref=f4e1019]: 我们可以看出功能单元的这种组合具有同时执行多个同类型操作的潜力。它有4个功 能单元可以执行整数操作，2个单元能执行加载操作，2个单元能执行浮点乘法。稍后我 们将看到这些资源对程序获得最大性能所带来的影响。
          - paragraph [ref=f4e1020]: 在ICU中，退役单元（retirement unit）记录正在进行的处理，并确保它遵守机器级程 序的顺序语义。我们的图中展示了一个寄存器文件，它包含整数、浮点数和最近的SSE 和 AVX 寄存器，是退役单元的一部分，因为退役单元控制这些寄存器的更新。指令译码时， 关于指令的信息被放置在一个先进先出的队列中。这个信息会一直保持在队列中，直到发 生以下两个结果中的一个。首先，一旦一条指令的操作完成了，而且所有引起这条指令的 分支点也都被确认为预测正确，那么这条指令就可以退役（retired）了，所有对程序寄存器 的更新都可以被实际执行了。另一方面，如果引起该指令的某个分支点预测错误，这条指 令会被清空（flushed），丢弃所有计算出来的结果。通过这种方法，预测错误就不会改变程 序的状态了。
          - paragraph [ref=f4e1021]: 正如我们已经描述的那样，任何对程序寄存器的更新都只会在指令退役时才会发生， 只有在处理器能够确信导致这条指令的所有分支都预测正确了，才会这样做。为了加速一 条指令到另一条指令的结果的传送，许多此类信息是在执行单元之间交换的，即图中的 “操作结果”。如图中的箭头所示，执行单元可以直接将结果发送给彼此。这是4.5.5节中 简单处理器设计中采用的数据转发技术的更复杂精细版本。
          - paragraph [ref=f4e1022]: 控制操作数在执行单元间传送的最常见的机制称为寄存器重命名（register renaming）。当 一条更新寄存器r的指令译码时，产生标记t，得到一个指向该操作结果的唯一的标识符。 条目（r，t）被加入到一张表中，该表维护着每个程序寄存器r与会更新该寄存器的操作的标 记t之间的关联。当随后以寄存器，作为操作数的指令译码时，发送到执行单元的操作会包 含t作为操作数源的值。当某个执行单元完成第一个操作时，会生成一个结果（v，t），指明 标记为t的操作产生值v。所有等待：作为源的操作都能使用作为源值，这就是一种形式的 数据转发。通过这种机制，值可以从一个操作直接转发到另一个操作，而不是写到寄存器文 件再读出来，使得第二个操作能够在第一个操作完成后尽快开始。重命名表只包含关于有未 进行写操作的寄存器条目。当一条被译码的指令需要寄存器r，而又没有标记与这个寄存器 相关联，那么可以直接从寄存器文件中获取这个操作数。有了寄存器重命名，即使只有在处 理器确定了分支结果之后才能更新寄存器，也可以预测着执行操作的整个序列。 旁注 乱序处理的历史 乱序处理最早是在1964年 Control Data Corporation 的6600处理器中实现的。指令 由十个不同的功能单元处理，每个单元都能独立地运行。在那个时候，这种时钟频率为 10Mhz的机器被认为是科学计算最好的机器。 在1966年，IBM首先是在IBM 360/91上实现了乱序处理，但只是用来执行浮点指 令。在大约25年的时间里，乱序处理都被认为是一项异乎寻常的技术，只在追求尽可 能高性能的机器中使用，直到1990年IBM在 RS/6000 系列工作站中重新引入了这项技 术。这种设计成为了IBM/Motorola PowerPC 系列的基础，1993年引入的型号601，它 成 第一个使用乱序处理的单芯片微处理器。Intel 在1995年的PentiumPro 型号中引入 了乱序处理，PentiumPro 的底层微体系结构类似于我们的参考机。
          - paragraph [ref=f4e1023]: 第5章 优化程序性能 361 5.7.2 功能单元的性能 图 5-12提供了 Intel Core i7 Haswell 参考机的一些算术运算的性能，有的是测量出来 的，有的是引用 Intel 的文献［49］。这些时间对于其他处理器来说也是具有代表性的。每 个运算都是由以下这些数值来刻画的：一个是延迟（latency），它表示完成运算所需要的总 时间；另一个是发射时间（issue time），它表示两个连续的同类型的运算之间需要的最小 时钟周期数；还有一个是容量（capacity），它表示能够执行该运算的功能单元的数量。 整数 浮点数 运算 延迟 发射 容量 延迟 发射 容量 加法 4 3 1 1 乘法 3 1 S 1 除法 3~30 3~30 3~15 3~15 1 图5-12 参考机的操作的延迟、发射时间和容量特性。延迟表明执行实际运算所需要的时钟周期总数， 而发射时间表明两次运算之间间隔的最小周期数。容量表明同时能发射多少个这样的操作。除法 需要的时间依赖于数据值
          - paragraph [ref=f4e1024]: 我们看到，从整数运算到浮点运算，延迟是增加的。还可以看到加法和乘法运算的发 射时间都为1，意思是说在每个时钟周期，处理器都可以开始一条新的这样的运算。这种 很短的发射时间是通过使用流水线实现的。流水线化的功能单元实现为一系列的阶段 （stage），每个阶段完成一部分的运算。例如，一个典型的浮点加法器包含三个阶段（所以 有三个周期的延迟）：一个阶段处理指数值，一个阶段将小数相加，而另一个阶段对结果 进行舍人。算术运算可以连续地通过各个阶段，而不用等待一个操作完成后再开始下一 个。只有当要执行的运算是连续的、逻辑上独立的时候，才能利用这种功能。发射时间为 1的功能单元被称为完全流水线化的（fully pipelined）：每个时钟周期可以开始一个新的运 算。出现容量大于1的运算是由于有多个功能单元，就如前面所述的参考机一样。
          - paragraph [ref=f4e1025]: 我们还看到，除法器（用于整数和浮点除法，还用来计算浮点平方根）不是完全流水线 化的——它的发射时间等于它的延迟。这就意味着在开始一条新运算之前，除法器必须完 成整个除法。我们还看到，对于除法的延迟和发射时间是以范围的形式给出的，因为某些 被除数和除数的组合比其他的组合需要更多的步骤。除法的长延迟和长发射时间使之成为 了一个相对开销很大的运算。 表达发射时间的一种更常见的方法是指明这个功能单元的最大吞吐量，定义发射时 间的倒数。一个完全流水线化的功能单元有最大的吞吐量，每个时钟周期一个运算，而发 射时间较大的功能单元的最大吞吐量比较小。具有多个功能单元可以进一步提高吞吐量。 对一个容量为C，发射时间为I的操作来说，处理器可能获得的吞吐量为每时钟周期C/1 个操作。比如，我们的参考机可以每个时钟周期执行两个浮点乘法运算。我们将看到如何 利用这种能力来提高程序的性能。
          - paragraph [ref=f4e1026]: 电路设计者可以创建具有各种性能特性的功能单元。创建一个延迟短或使用流水线的 单元需要较多的硬件，特别是对于像乘法和浮点操作这样比较复杂的功能。因为微处理器 芯片上，对于这些单元，只有有限的空间，所以CPU 设计者必须小心地平衡功能单元的 数量和它们各自的性能，以获得最优的整体性能。设计者们评估许多不同的基准程序，将 大多数资源用于最关键的操作。如图5-12 表明的那样，在 Core i7 Haswell 处理器的设计 中，整数乘法、浮点乘法和加法被认为是重要的操作，即使为了获得低延迟和较高的流水
          - paragraph [ref=f4e1027]: 362 第一部分 程序结构和执行 线化程度需要大量的硬件。另一方面，除法相对不太常用，而且要想实现低延迟或完全流 水线化是很困难的。
          - paragraph [ref=f4e1028]: 这些算术运算的延迟、发射时间和容量会影响合并函数的性能。我们用CPE 值的两 个基本界限来描述这种影响： 整数 浮点数 界限 延迟 吞吐量 1.00 0.50 3.00 1.00 + 3.00 1.00 5.00 0.50 延迟界限给出了任何必须按照严格顺序完成合并运算的函数所需要的最小CPE 值。根据 功能单元产生结果的最大速率，吞吐量界限给出了 CPE 的最小界限。例如，因为只有一 个整数乘法器，它的发射时间为1个时钟周期，处理器不可能支持每个时钟周期大于1条 乘法的速度。另一方面，四个功能单元都可以执行整数加法，处理器就有可能持续每个周 期执行4个操作的速率。不幸的是，因为需要从内存读数据，这造成了另一个吞吐量界 限。两个加载单元限制了处理器每个时钟周期最多只能读取两个数据值，从而使得吞吐量 界限为 0.50。我们会展示延迟界限和吞吐量界限对合并函数不同版本的影响。 5. 7.3 处理器操作的抽象模型 作分析在现代处理器上执行的机器级程序性能的一个工具，我们会使用程序的数据 流（data-flow）表示，这是一种图形化的表示方法，展现了不同操作之间的数据相关是如何 限制它们的执行顺序的。这些限制形成了图中的关键路径（critical path），这是执行一组机 器指令所需时钟周期数的一个下界。
          - paragraph [ref=f4e1029]: 在继续技术细节之前，检查一下函数 combine4的CPE 测量值是很有帮助的，到目前 为止 combine4是最快的代码： 整数 浮点数 函数 方法 * combine4 延迟界限 吞吐量界限 累积在临时变量中 1.27 1.00 0.50 3.01 3.00 1.00 + 3.01 3.00 1.00 5.01 5.00 0.50 我们可以看到，除了整数加法的情况，这些测量值与处理器的延迟界限是一样的。这 不是巧合—它表明这些函数的性能是由所执行的求和或者乘积计算主宰的。计算n个元 素的乘积或者和需要大约L•n十K个时钟周期，这里，是合并运算的延迟，而K 表示调 用函数和初始化以及终止循环的开销。因此，CPE就等于延迟界限L。
