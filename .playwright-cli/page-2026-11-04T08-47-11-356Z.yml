          - heading "前言与目录" [level=1] [ref=e96]
          - paragraph [ref=e97]: 计算机 科学丛书 HZ BOOKS 华章教育 Pearson 原书第3版 深入理解计算机系统 兰德尔 E. 布莱恩特（Randal E. Bryant） ［美］ 卡内基-梅隆大学 大卫 R. 奥哈拉伦（David R. O’Hallaron） 卡内基-梅隆大学 龚奕利 贺莲 译 Computer Systems A Programmer’s Perspective Third Edition THIRD EDITION COMPUTER SYSTEMS A PROGRAMMER’S PERSPECTIVE BRYANT•O’HALLARON 机械工业出版社 China Machine Press
          - heading "作者简介" [level=2] [ref=e98]
          - paragraph [ref=e99]: 兰德尔 E.布莱恩特 （Randal E. Bryant）
          - paragraph [ref=e100]: 1981年于麻省理工学院获得计算机博士学位， 1984年至今一直任教于卡内基-梅隆大学。现任卡 内基-梅隆大学计算机科学学院院长、教授，同时 还受邀任教于电子和计算机工程系。他从事本科生 和研究生计算机系统方面课程的教学近40年。他和 O’Hallaron教授一起在卡内基-梅隆大学开设了15- 213课程 “计算机系统导论”，该课程即为本书的基 础。他还是ACM院士、IEEE院士、美国国家工程院 院士和美国人文与科学研究院院士。其研究成果被 Intel、IBM、Fujitsu和Microsoft等主要计算机制造商 使用，他还因研究获得过Semiconductor Research Corporation、ACM、IEEE颁发的多项大奖。 大卫R.奥哈拉伦 （David R. O’Hallaron）
          - paragraph [ref=e101]: 卡内基-梅隆大学电子和计算机工程系教授。 在弗吉尼亚大学获得计算机科学的博士学位，2007 年一2010年为Intel匹兹堡实验室主任。他教授本科 生和研究生的计算机系统方面的课程已有20余年， 并和Bryant教授一起开设了“计算机系统导论”课 程。曾获得CMU计算机学院颁发的Herbert Simon杰 出教学奖。他主要从事计算机系统领域的研究，与 Quake项目成员一起获得过高性能计算领域中的最高 国际奖项一 -Gordon Bell奖。他目前的工作重点是 研究自动分级（ autograding）概念，即评价其他程 序质量的程序。
          - paragraph [ref=e102]: 计算机 科 原书第3版 学 丛 书 深入理解计算机系统 兰德尔 E. 布莱恩特（Randal E. Bryant） ［美］ 卡内基-梅隆大学 大卫 R. 奥哈拉伦（David R. O’Hallaron） 卡内基-梅隆大学 龚奕利 贺莲 译 Computer Systems A Programmer’s Perspective Third Edition THIRD EDITION COMPUTER SYSTEMS A PROGRAMMER’S PERSPECTIVE BRYANT。O’HALLARON 机械工业出版社 China Machine Press
