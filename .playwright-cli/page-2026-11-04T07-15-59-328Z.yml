            - text: ，具备网络层、分页列表、详情 SKU、可变集合与导航整合的完整闭环；至少两条覆盖关键用户流程的 Compose UI 测试；无障碍和发布验收按任务书逐项检查，性能结论须基于可复现的基准数据。
