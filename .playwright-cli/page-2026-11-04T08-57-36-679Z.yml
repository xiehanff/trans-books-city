          - paragraph [ref=f4e927]: 第二个妨碍优化的因素是函数调用。作为一个示例，考虑下面这两个过程： 1ong f0； long func1（）｛ return fO + fO +fO + £0； ｝ 7 1ong func2（）｛ return 4*fO）； 9 ｝
          - paragraph [ref=f4e928]: 最初看上去两个过程计算的都是相同的结果，但是func2只调用王一次，而func1 调用f四次。以 Eunc1作为源代码时，会很想产生func2风格的代码。
          - paragraph [ref=f4e929]: 不过，考虑下面王的代码： long counter = 0； 2 long f（）｛ return counter++； 5｝
          - paragraph [ref=f4e930]: 这个函数有个副作用—它修改了全局程序状态的一部分。改变调用它的次数会改变 程序的行为。特别地，假设开始时全局变量 counter 都设置为0，对func1 的调用会返回 0+1+2+3=6，而对func2的调用会返回4•0=0。
          - paragraph [ref=f4e931]: 大多数编译器不会试图判断一个函数是否没有副作用，如果没有，就可能被优化成像 func2中的样子。相反，编译器会假设最糟的情况，并保持所有的函数调用不变。 旁注 用内联函数替换优化函数调用 包含函数调用的代码可以用一个称为内联函数替換（inline substitution，或者简称 “内联（inlining）”）的过程进行优化，此时，将函数调用替换为函数体。例如，我们可以 通过替换掉对函数王的四次调用，展开 Euncl 的代码： 1 2 3 /* Result of inlining f in func1 */ long funclin（）｛
          - paragraph [ref=f4e932]:
            - text: 第5章 优化程序性能 345 4 t += counter++； t+= counter++； t+= counter++； return t； /
            - emphasis [ref=f4e933]: "+1"
            - text: / /
            - emphasis [ref=f4e934]: "+2"
            - text: / /
            - emphasis [ref=f4e935]: "+3"
            - text: / ｝ 这样的转换既减少了函数调用的开销，也允许对展开的代码做进一步优化。例如，编 译器可以统一 funclin 中对全局变量 counter 的更新，产生这个函数的一个优化版本： /* Optimization of inlined code */ long functopt（）｛ long t= 4 * counter + 6； 4 counter += 4； return t； ｝ 对于这个特定的函数王的定义，上述代码忠实地重现了 Eunc1的行为。 GCC的最近版本会尝试进行这种形式的优化，要么是被用命令行选项“-finline” 指示时，要么是使用优化等级-O1或者更高的等级时。遗憾的是，GCC只尝试在单个文 件中定义的函数的内联。这就意味着它将无法应用于常见的情况，即一组库函数在一个 文件中被定义，却被其他文件内的函数所调用。 在某些情况下，最好能阻止编译器执行内联替换。一种情况是用符号调试器来评估代 码，比如GDB，如3.10.2节描述的一样。如果一个函数调用已经用内联替换优化过了，那么 任何对这个调用进行追踪或设置断点的尝试都会失败。还有一种情况是用代码剖析的方式来 评估程序性能，如5.14.1节讨论的一样。用内联替换消除的函数调用是无法被正确剖析的。
          - paragraph [ref=f4e936]: 在各种编译器中，就优化能力来说，GCC被认为是胜任的，但是并不是特别突出。 它完成基本的优化，但是它不会对程序进行更加“有进取心的”编译器所做的那种激进变 换。因此，使用GCC 的程序员必须花费更多的精力，以一种简化编译器生成高效代码的 任务的方式来编写程序。 5.2 表示程序性能 我们引人度量标准每元素的周期数（Cycles Per Element，CPE），作为一种表示程序性 能并指导我们改进代码的方法。CPE这种度量标准帮助我们在更细节的级别上理解迭代程 序的循环性能。这样的度量标准对执行重复计算的程序来说是很适当的，例如处理图像中 的像素，或是计算矩阵乘积中的元素。
          - paragraph [ref=f4e937]: 处理器活动的顺序是由时钟控制的，时钟提供了某个频率的规律信号，通常用千兆赫 兹（GHz），即十亿周期每秒来表示。例如，当表明一个系统有“4GHz” 处理器，这表示 处理器时钟运行频率为每秒4X109个周期。每个时钟周期的时间是时钟频率的倒数。通常 是以纳秒（nanosecond，1纳秒等于10-9秒）或皮秒（picosecond,1 皮秒等于10-12秒）力单 位的。例如，一个 4GHz的时钟其周期0.25纳秒，或者250皮秒。从程序员的角度来 看，用时钟周期来表示度量标准要比用纳秒或皮秒来表示有帮助得多。用时钟周期来表 示，度量值表示的是执行了多少条指令，而不是时钟运行得有多快。
