          - paragraph [ref=f4e1184]: 392 第一部分 程序结构和执行 1.8。不过，很奇怪的是，整体运行时间只下降到5.1秒，差距只有0.2秒。 进一步观察，我们可以看到，表变大了但是性能提高很小，这是由于哈希函数选择的 不好。简单地对字符串的字符编码求和不能产生一个大范围的值。特别是，一个字母最大 的编码值是122，因而n个字符产生的和最多是122n。在文档中，最长的 bigram（“honor- ificabilitudinitatibus thou”）的和也不过是3371，所以，我们哈希表中大多数桶都是不会被 使用的。此外，可交换的哈希函数，例如加法，不能对一个字符串中不同的可能的字符顺 序做出区分。例如，单词 “rat”和 “tar”会产生同样的和。
