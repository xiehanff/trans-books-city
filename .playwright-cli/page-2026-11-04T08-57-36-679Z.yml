          - paragraph [ref=f4e966]: 未经优化的代码是从C语言代码到机器代码的直接翻译，通常效率明显较低。简单地 使用命令行选项“-O1”，就会进行一些基本的优化。正如可以看到的，程序员不需要做什 么，就会显著地提高程序性能——超过两个数量级。通常，养成至少使用这个级别优化的 习惯是很好的。（使用-Og优化级别能得到相似的性能结果。）在剩下的测试中，我们使用 -O1 和-O2级别的优化来生成和测量程序。 5.4 消除循环的低效率 可以观察到，过程 combine1调用函数 vec_length 作为 for 循环的测试条件，如 图5-5所示。回想关于如何将含有循环的代码翻译成机器级程序的讨论（见3.6.7节），每 次循环迭代时都必须对测试条件求值。另一方面，向量的长度并不会随着循环的进行而改 变。因此，只需计算一次向量的长度，然后在我们的测试条件中都使用这个值。 图 5-6是一个修改了的版本，称为 combine2，它在开始时调用 vec_length，并将结 果赋值给局部变量 length。对于某些数据类型和操作，这个变换明显地影响了某些数据 类型和操作的整体性能，对于其他的则只有很小甚至没有影响。无论是哪种情况，都需要 这种变换来消除这个低效率，这有可能成为尝试进一步优化时的瓶颈。 2 /* Move call to vec_length out of 1oop */ void combine2（vec_ptr V, data_t *dest） 4 S long i； long length = vec_length （v）； *dest = TDENT； for （1= 0;i < 1ength;i++）｛ data.t val； get_vec_element （v,i， &val）； *dest = *dest OP val； 8 9 10 11 12 13 ｝ 图 5-6 改进循环测试的效率。通过把对 vec_ _length 的调用移出循环测 试，我们不再需要每次迭代时都执行这个函数 整数 浮点数 函数 方法 combine1 combine2 抽象的-O1 移动 vec_length + 10.12 7.02 10.12 9.03 10.17 9.02 11.14 11.03 这个优化是一类常见的优化的一个例子，称为代码移动（code motion）。这类优化包括 识别要执行多次（例如在循环里）但是计算结果不会改变的计算。因而可以将计算移动到代 码前面不会被多次求值的部分。在本例中，我们将对 vec_length 的调用从循环内部移动
