          - paragraph [ref=f4e1083]: 第5革 优化程序性能 373 当平滑，不会出什么问题。即使有不连续的时候，它们通常也不会导致前面描述的条件那 样的周期性模式。按照严格顺序对元素求积的准确性不太可能从根本上比“分成两组独立 求积，然后再将这两个积相乘”更好。对大多数应用程序来说，使性能翻倍要比冒对奇怪 的数据模式产生不同的结果的风险更重要。但是，程序开发人员应该与潜在的用户协商， 看看是否有特殊的条件，可能会导致修改后的算法不能接受。大多数编译器并不会尝试对 浮点数代码进行这种变换，因它们没有办法判断引入这种会改变程序行为的转换所带来 的风险，不论这种改变是多么小。 5.9.2 重新结合变换
