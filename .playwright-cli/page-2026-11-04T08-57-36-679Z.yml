          - paragraph [ref=f4e1078]: 通常，只有保持能够执行该操作的所有功能单元的流水线都是满的，程序才能达到这 个操作的吞吐量界限。对延迟为L，容量为C的操作而言，这就要求循环展开因子k≥ C•L。比如，浮点乘有C=2，L=5，循环展开因子就必须为k≥10。浮点加有C=1， L=3，则在k≥3时达到最大吞吐量。
          - paragraph [ref=f4e1079]: 在执行kXk循环展开变换时，我们必须考虑是否要保留原始函数的功能。在第2章 已经看到，补码运算是可交换和可结合的，甚至是当溢出时也是如此。因此，对于整数数 据类型，在所有可能的情况下，combine6计算出的结果都和 combine5 计算出的相同。 因此，优化编译器潜在地能够将 combine4 中所示的代码首先转换成 combine5 的二路循 环展开的版本，然后再通过引入并行性，将之转换成 combine6的版本。有些编译器可以 做这种或与之类似的变换来提高整数数据的性能。
