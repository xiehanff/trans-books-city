          - paragraph [ref=f1e137]: C. 串中的什么部分不相匹配？ 2. 1.4 表示字符串 C 语言中字符串被编码为一个以 null（其值0）字符结尾的字符数组。每个字符都由 某个标准编码来表示，最常见的是 ASCII 字符码。因此，如果我们以参数 “12345”和6 （包括终止符）来运行例程 show」 bytes，我们得到结果 31 32 33 34 35 00。请注意，十进 制数字 x的ASCII 码正好是0x3x，而终止字节的十六进制表示为 0x00。在使用ASCII 码 作为字符码的任何系统上都将得到相同的结果，与字节顺序和字大小规则无关。因而，文 本数据比二进制数据具有更强的平台独立性。 练习题2.7 下面对 show_bytes 的调用将输出什么结果？ const char *s = “abcdef”； show_bytes （（byte_pointer） s, strlen （s））； 注意字母‘a’～‘z’的ASCII 码为 Ox61~0x7A。 旁注 文字编码的 Unicode 标准 ASCII 字符集适合于编码英语文档，但是在表达一些特字符方面并没有太多办法， 例如法语的“C”。它完全不适合编码希腊语、俄语和中文等语言的文档。这些年，提出了 很多方法来对不同语言的文字进行编码。Unicode 联合会（Unicode Consortium）修订了最全 面且广泛接受的文字编码标准。当前的 Unicode 标准（7.0版）的字库包括将近100 000个字 符，支持广泛的语言种类，包括古埃及和巴比伦的语言。为了保持信用，Unicode 技术委 员会否决了为 Klingon（即电视连续剧《星际迷航》中的虚构文明）编写语言标准的提议。 基本编码，称为 Unicode 的“统一字符集”，使用32位来表示字符。这好像要求文 本串中每个字符要占用4个字节。不过，可以有一些替代编码，常见的字符只需要1个 或2个字节，而不太常用的字符需要多一些的字节数。特别地，UTF-8表示将每个字符 编码为一个字节序列，这样标准 ASCII 字符还是使用和它们在 ASCII 中一样的单字节 编码，这也就意味着所有的 ASCII 字节序列用 ASCII 码表示和用UTF-8表示是一样的。 Java 编程语言使用 Unicode 来表示字符串。对于C语言也有支持 Unicode 的程序库。 2.1.5 表示代码 考虑下面的C函数：
