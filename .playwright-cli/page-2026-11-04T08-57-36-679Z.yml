          - paragraph [ref=f4e1138]: 如图5-11所示，现代处理器有专门的功能单元来执行加载和存储操作，这些单元有 内部的缓冲区来保存未完成的内存操作请求集合。例如，我们的参考机有两个加载单元， 每一个可以保存多达72个未完成的读请求。它还有一个存储单元，其存储缓冲区能保存 最多42个写请求。每个这样的单元通常可以每个时钟周期开始一个操作。 5. 12. 1 加载的性能 一个包含加载操作的程序的性能既依赖子流水线的能力，也依赖于加载单元的延迟。 在参考机上运行合并操作的实验中，我们看到除了使用SIMD操作时以外，对任何数据类 型组合和合并操作来说，CPE 从没有到过0.50以下。一个制约示例的CPE 的因素是，对 于每个被计算的元素，所有的示例都需要从内存读一个值。对两个加载单元而言，其每个 时钟周期只能启动一条加载操作，所以CPE 不可能小于0.50。对于每个被计算的元素必 须加载 个值的应用，我们不可能获得低于k/2的CPE（例如参见家庭作业5.15）。
