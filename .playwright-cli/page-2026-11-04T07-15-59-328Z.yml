          - code [ref=e180]: 预备篇 00A—00E ↓ 第 1—20 章：入口、布局、文字图片、列表与滚动 ↓ 第 21—25 章：本地状态、重组、恢复、状态提升、副作用 ↓ 第 26—45 章：交互组件、导航状态、组件注册、设计稿适配 ↓ 第 46—67 章：重组进阶、动画、绘制、布局、手势、互操作 ↓ 第 68—73 章：架构、生命周期、导航、持久化与协程 ↓ 第 74—80 章：性能、测试、主题、Insets、响应式布局与无障碍 ↓ 第 81—87 章：实践篇，真实接口小电商最小闭环（网络层→首页→详情→购物车→个人主页→整合验收）
          - paragraph [ref=e181]: 这是建议主线，不表示每章只依赖紧邻的上一章。第一次阅读时按编号前进；遇到“第 X 章详解”的进阶概念，先掌握本章明确解释的最小用法即可，读到目标章节再回来补齐。原项目中的导航在第 4—5 章先作基础介绍，第 31—35、71、71A 章再分别回看和扩展。
