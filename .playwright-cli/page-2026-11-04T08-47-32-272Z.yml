          - paragraph [ref=f1e140]: 我们发现指令编码是不同的。不同的机器类型使用不同的且不兼容的指令和编码方 式。即使是完全一样的进程，运行在不同的操作系统上也会有不同的编码规则，因此二进 制代码是不兼容的。二进制代码很少能在不同机器和操作系统组合之间移植。
          - paragraph [ref=f1e141]: 计算机系统的一个基本概念就是，从机器的角度来看，程序仅仅只是字节序列。机器 没有关于原始源程序的任何信息，除了可能有些用来帮助调试的辅助表以外。在第3章学 习机器级编程时，我们将更清楚地看到这一点。 2. 1.6 布尔代数简介 二进制值是计算机编码、存储和操作信息的核心，所以围绕数值0和1的研究已经演化 出了丰富的数学知识体系。这起源于 1850年前后乔治• 布尔（George Boole,1815—1864）的 工作，因此也称为布尔代数（Boolean algebra）。布尔注意到通过将逻辑值 TRUE（真）和 FALSE（假）编码为二进制值1 和0，能够设计出一种代数，以研究逻辑推理的基本原则。
          - paragraph [ref=f1e142]: 最简单的布尔代数是在二元集合｛0，1｝ & 0 基础上的定义。图2-7定义了这种布尔代数 0 1 0 0 中的几种运算。我们用来表示这些运算的符 0 号与C语言位级运算使用的符号是相匹配 图 2-7 布尔代数的运算。二进制值1和0表示 的，这些将在后面讨论到。布尔运算～对应 逻辑值 TRUE 或者 FALSE，而运算符 于逻辑运算 NOT，在命题逻辑中用符号一 ~、&、1和^分别表示逻辑运算 NOT、 AND、OR 和 EXCLUSIVE-OR 表示。也就是说，当P不是真的时候，我 们就说P是真的，反之亦然。相应地，当P等于0时，~P等于1，反之亦然。布尔运算 &. 对应于逻辑运算 AND，在命题逻辑中用符号A表示。当P和Q都为真时，我们说 PA Q为真。相应地，只有当 =1且q=1时，p&q 才等于1。布尔运算|对应于逻辑运算 OR，在命题逻辑中用符号V表示。当P或者Q为真时，我们说PVQ成立。相应地，当 =1或者9=1时，plg等于1。布尔运算~对应于逻辑运算异或，在命题逻辑中用符号① 表示。当P或者Q为真但不同时为真时，我们说P①Q成立。相应地，当=1且9=0， 或者 =0且9=1时， q等于1。
          - paragraph [ref=f1e143]: 后来创立信息论领域的Claude Shannon（1916—2001）首先建立了布尔代数和数字逻辑 之间的联系。他在1937年的硕士论文中表明了布尔代数可以用来设计和分析机电继电器 网络。尽管那时计算机技术已经取得了相当的发展，但是布尔代数仍然在数字系统的设计 和分析中扮演着重要的角色。
          - paragraph [ref=f1e144]: 我们可以将上述4个布尔运算扩展到位向量的运算，位向量就是固定长度为w、由0 和1组成的串。位向量的运算可以定义成参数的每个对应元素之间的运算。假设 a和6分 别表示位向量［aw-1，aw-2， ⋯，ao］和［bu-1，bu-2， …，6］。我们将.a&b 也定义为一个 长度 w的位向量，其中第i个元素等于a.&6,0≤i w。可以用类似的方式将运算|、^
          - paragraph [ref=f1e145]: 36 第一部分 程序结构和执行 和～扩展到位向量上。 举个例子，假设w=4， 参数a=［0110］，6=［1100］。那么4种运算a&b、alb、a~b 和~6分别得到以下结果： 0110 0110 & 1100 1100 0100 1110 练习题 2.8 0110 ^1100 1010 填写下表，给出位向量的布尔运算的求值结果。 运算 a ~ 1100 0011 结果 ［01101001］ ［01010101］ ~Q ~b a&b a1B a^b 网络旁注 DATA:BOOL 关于布尔代数和布尔环的更多内容 对于任意整数w0＞0，长度为w 的位向量上的布尔运算|、& 和~形成了一个布尔 代数。最简单的情况是w=1时，只有2个元素；但是对于更普遍的情况，有2 个长度 为w的位向量。布尔代数和整数算术运算有很多相似之处。例如，乘法对加法的分配 律，写为a •（B+c）=（a •6）+（a •c），而布尔运算&对|的分配律，写为a& （blc）= （a&b） |（a&c）。此外，布尔运算|对& 也有分配律，写为 al（b&c）=（alb）& （alc）， 但是对于整数我们不能说a十（6 c）=（a+B） （a十c）。 当考虑长度为w的位向量上的^、&. 和~运算时，会得到一种不同的数学形式，我 们称为布尔环（Boolean ring）。布尔环与整数运算有很多相同的属性。例如，整数运算 的一个属性是每个值z都有一个加法逆元（additive inverse）一z，使得z十（一z）=0。布 尔环也有类似的属性，这里的“加法”运算是^，不过这时每个元素的加法逆元是它自 己本身。也就是说，对于任何值a来说，a~Q=0，这里我们用0来表示全0的位向量。 可以看到对单个位来说这是成立的，即0~0=1、1=0，将这个扩展到位向量也是成立 的。当我们重新排列组合顺序，这个属性也仍然成立，因此有（a~b） a=6。这个属性会 引起一些很有趣的结果和聪明的技巧，在练习题2.10中我们会有所探讨。
          - paragraph [ref=f1e146]: 位向量一个很有用的应用就是表示有限集合。我们可以用位向量［aw-1，⋯，ai，Qo］ 编码任何子集 AS｛0，1，⋯，w-1｝，其中a：=1当且仅当iA。例如（记住我们是把 Qw-1写在左边，而将a。写在右边），位向量a=［01101001］表示集合A=10，3，5，6）， 而6=［01010101］表示集合B=｛0，2，4，6｝。使用这种编码集合的方法，布尔运算|和 &分别对应于集合的并和交，而~对应于于集合的补。还是用前面那个例子，运算a&b 得到位向量［01000001］，而 ANB=｛0，6｝。
