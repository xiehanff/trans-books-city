          - paragraph [ref=e104]: 本书中文简体字版由 Pearson Education（培生教育出版集团）授权机械工业出版社在中华人民共 和国境内（不包括中国台湾地区和中国香港、澳门特别行政区）独家出版发行。未经出版者书面许可， 不得以任何方式抄袭、复制或节录本书中的任何部分。
          - paragraph [ref=e105]: 本书封底贴有 Pearson Education（培生教育出版集团）激光防伪标签，无标签者不得销售。
          - paragraph [ref=e106]: 本书从程序员的视角详细阐述计算机系统的本质概念，并展示这些概念如何实实在在地影响应用 程序的正确性、性能和实用性。全书共 12章，主要包括信息的表示和处理、程序的机器级表示、处理 器体系结构、优化程序性能、存储器层次结构、链接、异常控制流、虚拟存储器、系统级 I/O、网络编 程、并发编程等内容。书中提供了大量的例子和练习题，并给出部分答案，有助于读者加深对正文所述 概念和知识的理解。
          - paragraph [ref=e107]: 本书适合作为高等院校计算机及相关专业本科生、研究生的教材，也可供想要写出更快、更可靠程 序的程序员及专业技术人员参考。 出版发行：机械工业出版社（北京市西城区百万庄大街 22号 责任编辑：和 静 印刷：中国电影出版社印刷厂 开 本：185mm × 260mm 1/16 书 号：ISBN 978-7-111-54493-7 凡购本书，如有缺页、倒页、脱页，由本社发行部调换 客服热线：（010） 88378991 88361066 购书热线：（010） 68326294 88379649 68995259 版权所有•侵权必究 封底无防伪标均为盗版 本书法律顾问：北京大成律师事务所 韩光/邹晓东 邮政编码：100037） 责任校对：股虹 版 次：2016年11月第1版第1次印刷 印张：48.25 定价：139.00元 投稿热线：（010）88379604 读者信箱：hzjsj@hzbook.com
          - paragraph [ref=e108]: 文 -艺复兴以来，源远流长的科学精神和逐步形成的学术规范，使西 方国家在自然科学的各个领域取得了垄断性的优势；也正是这样 的优势，使美国在信息技术发展的六十多年间名家辈出、独领风骚。在 商业化的进程中，美国的产业界与教育界越来越紧密地结合，计算机学 科中的许多泰山北斗同时身处科研和教学的最前线，由此而产生的经典 科学著作，不仅擘划了研究的范畴，还揭示了学术的源变，既遵循学术 规范，又自有学者个性，其价值并不会因年月的流逝而减退。
          - paragraph [ref=e109]: 近年，在全球信息化大潮的推动下，我国的计算机产业发展迅猛， 对专业人才的需求日益迫切。这对计算机教育界和出版界都既是机遇， 也是挑战；而专业教材的建设在教育战略上显得举足轻重。在我国信息 技术发展时间较短的现状下，美国等发达国家在其计算机科学发展的几 十年间积淀和发展的经典教材仍有许多值得借鉴之处。因此，引进一批 国外优秀计算机教材将对我国计算机教育事业的发展起到积极的推动作 用，也是与世界接轨、建设真正的世界一流大学的必由之路。
          - paragraph [ref=e110]: 机械工业出版社华章公司较早意识到“出版要为教育服务”。自1998 年开始，我们就将工作重点放在了遴选、移译国外优秀教材上。经过多 年的不懈努力，我们与 Pearson,McGraw-Hill，Elsevier, MIT,John Wiley &. Sons,Cengage 等世界著名出版公司建立了良好的合作关系，从 他们现有的数百种教材中甄选出 Andrew S. Tanenbaum,Bjarne Strous- trup,Brian W. Kernighan,Dennis Ritchie,Jim Gray, Afred V. Aho, John E .Hopcroft, Jeffrey D. Ullman, Abraham Silberschatz, William Stallings， Donald E. Knuth, John L. Hennessy, Larry L. Peterson 等大师名家的一 批经典作品，以“计算机科学丛书”为总称出版，供读者学习、研究及 珍藏。大理石纹理的封面，也正体现了这套丛书的品位和格调。
          - paragraph [ref=e111]: “计算机科学丛书”的出版工作得到了国内外学者的鼎力相助，国内的 专家不仅提供了中肯的选题指导，还不辞劳苦地担任了翻译和审校的工作； 而原书的作者也相当关注其作品在中国的传播，有的还专门为其书的中译本 作序。迄今，“计算机科学丛书”已经出版了近两百个品种，这些书籍在读 者中树立了良好的口碑，并被许多高校采用为正式教材和参考书籍。其影印 版“经典原版书库”作为姊妹篇也被越来越多实施双语教学的学校所采用。
          - paragraph [ref=e112]: IV
          - paragraph [ref=e113]:
            - text: 权威的作者、经典的教材、一流的译者、严格的审校、精细的编辑，这些因素使我们的图 书有了质量的保证。随着计算机科学与技术专业学科建设的不断完善和教材改革的逐渐深化， 教育界对国外计算机教材的需求和应用都将步入一个新的阶段，我们的目标是尽善尽美，而反 馈的意见正是我们达到这一终极目标的重要帮助。华章公司欢迎老师和读者对我们的工作提出 建议或给予指正，我们的联系方法如下： 华章网站：
