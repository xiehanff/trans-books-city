          - paragraph [ref=f4e978]: 第5章 优化程序性能 353 这段无危险的代码变成了一个主要的性能瓶颈。相比较而言，1ower2的性能对于任意长 度的字符串来说都是足够的。大型编程项目中出现这样问题的故事比比皆是。一个有经验 的程序员工作的一部分就是避免引入这样的渐近低效率。
