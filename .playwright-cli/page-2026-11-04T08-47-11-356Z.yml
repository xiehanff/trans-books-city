          - paragraph [ref=e159]: code/intro/hello.c 图1 一个典型的代码示例
          - paragraph [ref=e160]: 为了避免本书体积过大、内容过多，我们添加了许多网络旁注（Web aside），包括一些对 本书主要内容的补充资料。本书中用CHAP:TOP 这样的标记形式来引用这些旁注，这里 CHAP是该章主题的缩写编码，而TOP 是涉及的话题的缩写编码。例如，网络旁注 DATA： BOOL包含对第2章中数据表示里面有关布尔代数内容的补充资料；而网络旁注 ARCH： VLOG 包含的是用 Verilog 硬件描述语言进行处理器设计的资料，是对第4章中处理器设计部 分的补充。所有的网络旁注都可以从CS:APP 的主页上获取。 旁注 什么是旁注 在整本书中，你将会遇到很多以这种形式出现的旁注。旁注是附加说明，能使你对当前 讨论的主题多一些了解。旁注可以有很多用处。一些是小的历史故事。例如，C语言、 Linux 和 Internet 是从何而来的？有些旁注则是用来澄清学生们经常感到疑惑的问题。例如， 高速缓存的行、组和块有什么区别？还有些旁注给出了一些现实世界的例子。例如，一个浮 点错误怎么毁掉了法国的一枚火箭，或是给出市面上出售的一个磁盘驱动器的几何和运行参 数。最后，还有一些旁注仅仅就是一些有趣的內容，例如，什么是“hoinky”？
          - paragraph [ref=e161]: XIV
          - heading "本书概述" [level=2] [ref=e162]
          - paragraph [ref=e163]: 本书由12章组成，旨在阐述计算机系统的核心概念。内容概述如下：
          - list [ref=e164]:
            - listitem [ref=e165]: 第1章：计算机系统漫游。这一章通过研究 “hello，world”这个简单程序的生命周期， 介绍计算机系统的主要概念和主题。
            - listitem [ref=e166]: 第2章：信息的表示和处理。我们讲述了计算机的算术运算，重点描述了会对程序员有 影响的无符号数和数的补码表示的特性。我们考虑数字是如何表示的，以及由此确定对 于一个给定的字长，其可能编码值的范围。我们探讨有符号和无符号数字之间类型转换 的效果，还阐述算术运算的数学特性。菜鸟级程序员经常很惊奇地了解到（用补码表示的） 两个正数的和或者积可能为负。另一方面，补码的算术运算满足很多整数运算的代数特 性，因此，编译器可以很安全地把一个常量乘法转化为一系列的移位和加法。我们用C 语言的位级操作来说明布尔代数的原理和应用。我们从两个方面讲述了 IEEE 标准的浮点 格式：一是如何用它来表示数值，一是浮点运算的数学属性。 对计算机的算术运算有深刻的理解是写出可靠程序的关键。比如，程序员和编译器 不能用表达式（x-y<0）来替代（x<y），因为前者可能会产生溢出。甚至也不能用表达式 （-y<-x）来替代，因为在补码表示中负数和正数的范围是不对称的。算术溢出是造成程 序错误和安全漏洞的一个常见根源，然而很少有书从程序员的角度来讲述计算机算术运 算的特性。
            - listitem [ref=e167]: 第3章：程序的机器级表示。我们教读者如何阅读由C编译器生成的x86-64 机器代码。 我们说明为不同控制结构（比如条件、循环和开关语句）生成的基本指令模式。我们还讲述 过程的实现，包括栈分配、寄存器使用惯例和参数传递。我们讨论不同数据结构（如结构、 联合和数组）的分配和访问方式。我们还说明实现整数和浮点数算术运算的指令。我们还 以分析程序在机器级的样子作为途径，来理解常见的代码安全漏洞（例如缓冲区溢出），以 及理解程序员、编译器和操作系统可以采取的减轻这些威胁的措施。学习本章的概念能 够帮助读者成为更好的程序员，因为你们懂得程序在机器上是如何表示的。另外一个好 处就在于读者会对指针有非常全面而具体的理解。
            - listitem [ref=e168]: 第4章：处理器体系结构。这一章讲述基本的组合和时序逻辑元素，并展示这些元素如 何在数据通路中组合到一起，来执行 x86-64 指令集的一个称为“Y86-64”的简化子集。 我们从设计单时钟周期数据通路开始。这个设计概念上非常简单，但是运行速度不会太 快。然后我们引人流水线的思想，将处理一条指令所需要的不同步骤实现为独立的阶段。 这个设计中，在任何时刻，每个阶段都可以处理不同的指令。我们的五阶段处理器流水 线更加实用。本章中处理器设计的控制逻辑是用一种称为 HCL 的简单硬件描述语言来描 述的。用 HCL 写的硬件设计能够编译和链接到本书提供的模拟器中，还可以根据这些设计
          - paragraph [ref=e169]: XV 生成 Verilog 描述，它适合合成到实际可以运行的硬件上去。
          - list [ref=e170]:
            - listitem [ref=e171]: 第5章：优化程序性能。在这一章里，我们介绍了许多提高代码性能的技术，主要思想 就是让程序员通过使编译器能够生成更有效的机器代码来学习编写C代码。我们一开始 介绍的是减少程序需要做的工作的变换，这些是在任何机器上写任何程序时都应该遵循 的。然后讲的是增加生成的机器代码中指令级并行度的变换，因而提高了程序在现代 “超标量”处理器上的性能。为了解释这些变换行之有效的原理，我们介绍了一个简单 的操作模型，它描述了现代乱序处理器是如何工作的，然后给出了如何根据一个程序的 图形化表示中的关键路径来测量一个程序可能的性能。你会惊讶于对C代码做一些简单 的变换能给程序带来多大的速度提升。
            - listitem [ref=e172]: 第6章：存储器层次结构。对应用程序员来说，存储器系统是计算机系统中最直接可见 的部分之一。到目前为止，读者一直认同这样一个存储器系统概念模型，认为它是一个 有一致访问时间的线性数组。实际上，存储器系统是一个由不同容量、造价和访问时间 的存储设备组成的层次结构。我们讲述不同类型的随机存取存储器（RAM）和只读存储器 （ROM），以及磁盘和固态硬盘°的几何形状和组织构造。我们描述这些存储设备是如 何放置在层次结构中的，讲述访问局部性是如何使这种层次结构成为可能的。我们通 过一个独特的观点使这些理论具体化，那就是将存储器系统视为一个“存储器山”， 山脊是时间局部性，而斜坡是空间局部性。最后，我们向读者阐述如何通过改善程序 的时间局部性和空间局部性来提高应用程序的性能。
            - listitem [ref=e173]: 第7章：链接。本章讲述静态和动态链接，包括的概念有可重定位的和可执行的目 标文件、符号解析、重定位、静态库、共享目标库、位置无关代码，以及库打桩。 大多数讲述系统的书中都不讲链接，我们要讲述它是出于以下原因。第一，程序员 遇到的最令人迷惑的问题中，有一些和链接时的小故障有关，尤其是对那些大型软 件包来说。第二，链接器生成的目标文件是与一些像加载、虚拟内存和内存映射这 样的概念相关的。
            - listitem [ref=e174]: 第8章：异常控制流。在本书的这个部分，我们通过介绍异常控制流（即除正常分 支和过程调用以外的控制流的变化）的一般概念，打破单一程序的模型。我们给出 存在于系统所有层次的异常控制流的例子，从底层的硬件异常和中断，到并发进程 的上下文切换，到由于接收 Linux 信号引起的控制流突变，到C语言中破坏栈原则 的非本地跳转。 在这一章，我们介绍进程的基本概念，进程是对一个正在执行的程序的一种抽 象。读者会学习进程是如何工作的，以及如何在应用程序中创建和操纵进程。我们 ①
          - paragraph [ref=e175]: 直译应为固态驱动器，但固态硬盘一词已经被大家接受，所以沿用。——译者注
          - paragraph [ref=e176]: ×VI 会展示应用程序员如何通过Linux 系统调用来使用多个进程。学完本章之后，读者 就能够编写带作业控制的Linux shell 了。同时，这里也会向读者初步展示程序的并 发执行会引起不确定的行为。
          - list [ref=e177]:
            - listitem [ref=e178]: 第9章：虚拟内存。我们讲述虚拟内存系统是希望读者对它是如何工作的以及它的特 性有所了解。我们想让读者了解为什么不同的并发进程各自都有一个完全相同的地址 范围，能共享某些页，而又独占另外一些页。我们还讲了一些管理和操纵虚拟内存的 问题。特别地，我们讨论了存储分配操作，就像标准库的 malloc 和 free 操作。阐述 这些内容是出于下面几个目的。它加强了这样一个概念，那就是虚拟内存空间只是一 个字节数组，程序可以把它划分成不同的存储单元。它可以帮助读者理解当程序包含 存储泄漏和非法指针引用等内存引用错误时的后果。最后，许多应用程序员编写自己 的优化了的存储分配操作来满足应用程序的需要和特性。这一章比其他任何一章都更 能展现将计算机系统中的硬件和软件结合起来阐述的优点。而传统的计算机体系结构 和操作系统书籍都只讲述虚拟内存的某一方面。
            - listitem [ref=e179]: 第10章：系统级 I/O。我们讲述 Unix I/O 的基本概念，例如文件和描述符。我们 描述如何共享文件，I/O 重定向是如何工作的，还有如何访问文件的元数据。我们 还开发了一个健壮的带缓冲区的 I/O 包，可以正确处理一种称为 short counts 的奇 特行为，也就是库函数只读取一部分的输入数据。我们阐述C的标准 I/O 库，以及 它与 Linux I/O 的关系，重点谈到标准 I/O 的局限性，这些局限性使之不适合网络 编程。总的来说，本章的主题是后面两章—网络和并发编程的基础。
            - listitem [ref=e180]: 第11章：网络编程。对编程而言，网络是非常有趣的 I/O 设备，它将许多我们前面 文中学习的概念（比如进程、信号、字节顺序、内存映射和动态内存分配）联系在一起。 网络程序还为下一章的主题并发，提供了一个很令人信服的上下文。本章只是网 络编程的一个很小的部分，使读者能够编写一个简单的 Web 服务器。我们还讲述位于 所有网络程序底层的客户端-服务器模型。我们展现了一个程序员对 Internet 的观点， 并且教读者如何用套接字接口来编写 Internet 客户端和服务器。最后，我们介绍超文 本传输协议（HTTP），并开发了一个简单的迭代式 Web 服务器。
            - listitem [ref=e181]: 第12章：并发编程。这一章以 Internet 服务器设计为例介绍了并发编程。我们比较 对照了三种编写并发程序的基本机制（进程、I/O 多路复用和线程），并且展示如何用 它们来建造并发 Internet 服务器。我们探讨了用 P、V 信号量操作来实现同步、线程 安全和可重入、竞争条件以及死锁等的基本原则。对大多数服务器应用来说，写并发 代码都是很关键的。我们还讲述了线程级编程的使用方法，用这种方法来表达应用程 序中的并行性，使得程序在多核处理器上能执行得更快。使用所有的核解决同一个计 算问题需要很小心谨慎地协调并发线程，既要保证正确性，又要争取获得高性能。
          - paragraph [ref=e182]: XVII
          - heading "本版新增内容" [level=2] [ref=e183]
          - paragraph [ref=e184]: 本书的第1版于2003年出版，第2版在2011年出版。考虑到计算机技术发展如此迅速， 这本书的内容还算是保持得很好。事实证明 Intel x86的机器上运行Linux（以及相关操作系 统），加上采用C语言编程，是一种能够涵盖当今许多系统的组合。然而，硬件技术、编译 器和程序库接口的变化，以及很多教师教授这些内容的经验，都促使我们做了大量的修改。
          - paragraph [ref=e185]: 第2版以来的最大整体变化是，我们的介绍从以IA32 和 x86-64为基础，转变为完全 以x86-64为基础。这种重心的转移影响了很多章节的内容。下面列出一些明显的变化：
          - list [ref=e186]:
            - listitem [ref=e187]: 第1章。我们将第5章对 Amdahl 定理的讨论移到了本章。
            - listitem [ref=e188]: 第2章。读者和评论家的反馈是一致的，本章的一些内容有点令人不知所措。因 此，我们澄清了一些知识点，用更加数学的方式来描述，使得这些内容更容易理 解。这使得读者能先略过数学细节，获得高层次的总体概念，然后回过头来进行更 细致深人的阅读。
            - listitem [ref=e189]: 第3章。我们将之前基于IA32和 x86-64的表现形式转换为完全基于 x86-64，还更 新了近期版本GCC产生的代码。其结果是大量的重写工作，包括修改了一些概念 提出的顺序。同时，我们还首次介绍了对处理浮点数据的程序的机器级支持。由于 历史原因，我们给出了一个网络旁注描述IA32 机器码。
            - listitem [ref=e190]: 第4章。我们将之前基于32位架构的处理器设计修改为支持64位字和操作的设计。
            - listitem [ref=e191]: 第5章。我们更新了内容以反映最近几代 x86-64 处理器的性能。通过引入更多的功 能单元和更复杂的控制逻辑，我们开发的基于程序数据流表示的程序性能模型，其 性能预测变得比之前更加可靠。
            - listitem [ref=e192]: 第6章。我们对内容进行了更新，以反映更多的近期技术。
            - listitem [ref=e193]: 第7章。针对 x86-64，我们重写了本章，扩充了关于用GOT 和 PLT 创建位置无关 代码的讨论，新增了一节描述更加强大的链接技术，比如库打桩。
            - listitem [ref=e194]: 第8章。我们增加了对信号处理程序更细致的描述，包括异步信号安全的函数，编写 信号处理程序的具体指导原则，以及用 sigsuspend 等待处理程序。
            - listitem [ref=e195]: 第9章。本章变化不大。
            - listitem [ref=e196]: 第10章。我们新增了一节说明文件和文件的层次结构，除此之外，本章的变化 不大。
            - listitem [ref=e197]: 第11章。我们介绍了采用最新 getaddrinfo 和 getnameinfo 函数的、与协议无 关和线程安全的网络编程，取代过时的、不可重入的 gethostbyname 和 gethost- byaddr 函数。
          - paragraph [ref=e198]: XVIII
          - list [ref=e199]:
            - listitem [ref=e200]: 第12章。我们扩充了利用线程级并行性使得程序在多核机器上更快运行的内容。
          - paragraph [ref=e201]: 此外，我们还增加和修改了很多练习题和家庭作业。
          - heading "本书的起源" [level=3] [ref=e202]
          - paragraph [ref=e203]: 本书起源于1998年秋季，我们在卡内基-梅隆（CMU）大学开设的一门编号为 15-213 的介绍性课程：计算机系统导论（Introduction to Computer System，ICS）［14］。从那以 后，每学期都开设了ICS这门课程，每学期有超过400名学生上课，这些学生从本科二年 级到硕士研究生都有，所学专业也很广泛。这门课程是卡内基-梅隆大学计算机科学系 （CS）以及电子和计算机工程系（ECE）所有本科生的必修课，也是CS 和ECE 大多数高级 系统课程的先行必修课。
          - paragraph [ref=e204]: ICS这门课程的宗旨是用一种不同的方式向学生介绍计算机。因为，我们的学生中几 乎没有人有机会亲自去构造一个计算机系统。另一方面，大多数学生，甚至包括所有的计 算机科学家和计算机工程师，也需要日常使用计算机和编写计算机程序。所以我们决定从 程序员的角度来讲解系统，并采用这样的原则过滤要讲述的内容：我们只讨论那些影响用 户级C语言程序的性能、正确性或实用性的主题。
          - paragraph [ref=e205]: 比如，我们排除了诸如硬件加法器和总线设计这样的主题。虽然我们谈及了机器语 言，但是重点并不在于如何手工编写汇编语言，而是关注C语言编译器是如何将C语言的 结构翻译成机器代码的，包括编译器是如何翻译指针、循环、过程调用以及开关（switch） 语句的。更进一步地，我们将更广泛和全盘地看待系统，包括硬件和系统软件，涵盖了包 括链接、加载、进程、信号、性能优化、虚拟内存、I/O 以及网络与并发编程等在内的 主题。
          - paragraph [ref=e206]: 这种做法使得我们讲授ICS课程的方式对学生来讲既实用、具体，还能动手操作，同 时也非常能调动学生的积极性。很快地，我们收到来自学生和教职工非常热烈而积极的反 响，我们意识到卡内基-梅隆大学以外的其他人也可以从我们的方法中获益。因此，这本 书从 ICS课程的笔记中应运而生了，而现在我们对它做了修改，使之能够反映科学技术以 及计算机系统实现中的变化和进步。
          - paragraph [ref=e207]: 通过本书的多个版本和多种语言译本，ICS和许多相似课程已经成为世界范围内数百 所高校的计算机科学和计算机工程课程的一部分。
          - heading "写给指导教师们：可以基于本书的课程" [level=3] [ref=e208]
          - paragraph [ref=e209]: 指导教师可以使用本书来讲授五种不同类型的系统课程（见图2）。具体每门课程则有
          - paragraph [ref=e210]: XIX 赖于课程大纲的要求、个人喜好、学生的背景和能力。图中的课程从左往右越来越强调以 程序员的角度来看待系统。以下是简单的描述。
          - list [ref=e211]:
            - listitem [ref=e212]: ORG：一门以非传统风格讲述传统主题的计算机组成原理课程。传统的主题包括逻辑设 计、处理器体系结构、汇编语言和存储器系统，然而这里更多地强调了对程序员的影 响。例如，要反过来考虑数据表示对C语言程序的数据类型和操作的影响。又例如，对 汇编代码的讲解是基于C语言编译器产生的机器代码，而不是手工编写的汇编代码。
            - listitem [ref=e213]: ORG+：一门特别强调硬件对应用程序性能影响的ORG 课程。和ORG 课程相比， 学生要更多地学习代码优化和改进C语言程序的内存性能。
            - listitem [ref=e214]: ICS：基本的ICS 课程，旨在培养一类程序员，他们能够理解硬件、操作系统和编 译系统对应用程序的性能和正确性的影响。和 ORG＋课程的一个显著不同是，本 课程不涉及低层次的处理器体系结构。相反，程序员只同现代乱序处理器的高级模 型打交道。ICS课程非常适合安排到一个10周的小学期，如果期望步调更从容一 些，也可以延长到一个15 周的学期。
            - listitem [ref=e215]: ICS+：在基本的ICS课程基础上，额外论述一些系统编程的问题，比如系统级 I/O、网络编程和并发编程。这是卡内基-梅隆大学的一门一学期时长的课程，会讲 述本书中除了低级处理器体系结构以外的所有章。
            - listitem [ref=e216]: SP：一门系统编程课程。和ICS＋课程相似，但是剔除了浮点和性能优化的内容， 更加强调系统编程，包括进程控制、动态链接、系统级 I/O、网络编程和并发编程。 指导教师可能会想从其他渠道对某些高级主题做些补充，比如守护进程（daemon）、 终端控制和 Unix IPC（进程间通信）。 图2要表达的主要信息是本书给了学生和指导教师多种选择。如果你希望学生更多地 章号 主题 ORG ORG+ 课程 ICS ICS+ SP 1 3 7 8 9 10 11 12 系统漫游 数据表示 机器语言 处理器体系结构 代码优化 存储器层次结构 链接 异常控制流 虚拟内存 系统级 I/O 网络编程 并发编程 ◎ （d） ◎（a） 、（a） （c） （c） ◎（b） 图2 五类基于本书的课程 注：符号◎表示覆盖部分章节，其中：（a）只有硬件；（b）无动态存储分配；（c）无动态链接；（d）无浮点运算。 ICS+是卡内基-梅隆的 15-213课程。
          - paragraph [ref=e217]: ×X 了解低层次的处理器体系结构，那么通过ORG 和 ORG＋课程可以达到目的。另一方面， 如果你想将当前的计算机组成原理课程转换成ICS或者ICS＋课程，但是又对突然做这样 剧烈的变化感到担心，那么你可以逐步递增转向ICS课程。你可以从 ORG 课程开始，它 以一种非传统的方式教授传统的问题。一旦你对这些内容感到驾轻就熟了，就可以转到 ORG+，最终转到ICS。如果学生没有C语言的经验（比如他们只用Java 编写过程序）， 你可以花几周的时间在C语言上，然后再讲述ORG或者ICS课程的内容。
          - paragraph [ref=e218]: 最后，我们认为 ORG＋和 SP 课程适合安排为两期（两个小学期或者两个学期）。或者 你可以考虑按照一期ICS和一期SP的方式来教授ICS＋课程。
          - heading "写给指导教师们：经过课堂验证的实验练习" [level=3] [ref=e219]
          - paragraph [ref=e220]: ICS+课程在卡内基-梅隆大学得到了学生很高的评价。学生对这门课程的评价，中值 分数一般为5.0/5.0，平均分数一般为4.6/5.0。学生们说这门课非常有趣，令人兴奋！ 主要就是因为相关的实验练习。这些实验练习可以从CS:APP的主页上获得。下面是本书 提供的一些实验的示例。
          - list [ref=e221]:
            - listitem [ref=e222]: 数据实验。这个实验要求学生实现简单的逻辑和算术运算函数，但是只能使用一个 非常有限的C语言子集。比如，只能用位级操作来计算一个数字的绝对值。这个实 验可帮助学生了解C语言数据类型的位级表示，以及数据操作的位级行为。
            - listitem [ref=e223]: 二进制炸弹实验。二进制炸弹是一个作为目标代码文件提供给学生的程序。运行 时，它提示用户输人6个不同的字符串。如果其中的任何一个不正确，炸弹就会 “爆炸”，打印出一条错误消息，并且在一个打分服务器上记录事件日志。学生必须 通过对程序反汇编和逆向工程来测定应该是哪6个串，从而拆除各自的炸弹。 该实验能教会学生理解汇编语言，并且强制他们学习怎样使用调试器。
            - listitem [ref=e224]: 缓冲区溢出实验。它要求学生通过利用一个缓冲区溢出漏洞，来修改一个二进制可 执行文件的运行时行为。这个实验可教会学生栈的原理，并让他们了解写那种易于 遭受缓冲区溢出攻击的代码的危险性。
            - listitem [ref=e225]: 体系结构实验。第4章的几个家庭作业能够组合成一个实验作业，在实验中，学生 修改处理器的 HCL 描述，增加新的指令，修改分支预测策略，或者增加、删除旁 路路径和寄存器端口。修改后的处理器能够被模拟，并通过运行自动化测试检测出 大多数可能的错误。这个实验使学生能够体验处理器设计中令人激动的部分，而不 需要掌握逻辑设计和硬件描述语言的完整知识。
            - listitem [ref=e226]: 性能实验。学生必须优化应用程序的核心函数（比如卷积积分或矩阵转置）的性能。这 个实验可非常清晰地表明高速缓存的特性，并带给学生低级程序优化的经验。
          - paragraph [ref=e227]: XXI
          - list [ref=e228]:
            - listitem [ref=e229]: cache 实验。这个实验类似于性能实验，学生编写一个通用高速缓存模拟器，并优 化小型矩阵转置核心函数，以尽量减少模拟缓存的未命中次数。我们使用 Valgrind 为矩阵转置核心函数生成真实的地址访问记录。
            - listitem [ref=e230]: shell 实验。学生实现他们自己的带有作业控制的 Unix shell 程序，包括Ctrl+C 和 Ctrl+Z按键，fg、bg 和 jobs 命令。这是学生第一次接触并发，并且让他们对 Unix 的进程控制、信号和信号处理有清晰的了解。
            - listitem [ref=e231]: malloc 实验。学生实现他们自己的 malloc、free 和 realloc（可选）版本。这个 实验可让学生们清晰地理解数据的布局和组织，并且要求他们评估时间和空间效率 的各种权衡及折中。
            - listitem [ref=e232]: 代理实验。实现一个位于浏览器和万维网其他部分之间的并行 Web 代理。这个实 验向学生们揭示了 Web 客户端和服务器这样的主题，并且把课程中的许多概念联 系起来，比如字节排序、文件 I/O、进程控制、信号、信号处理、内存映射、套接 字和并发。学生很高兴能够看到他们的程序在真实的 Web 浏览器和 Web 服务器之 间起到的作用。
          - paragraph [ref=e233]: CS:APP的教师手册中有对实验的详细讨论，还有关于下载支持软件的说明。
