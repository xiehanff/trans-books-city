          - paragraph [ref=f1e61]: 计算机可能没有产生期望的结果，但是至少它是一致的！
          - paragraph [ref=f1e62]: 浮点运算有完全不同的数学属性。虽然溢出会产生特殊的值十∞，但是一组正数的乘 积总是正的。由于表示的精度有限，浮点运算是不可结合的。例如，在大多数机器上，C 表达式（3.14+1e20）-1e20求得的值会是0.0，而3.14+（1e20-1e20）求得的值会是3.14。 整数运算和浮点数运算会有不同的数学属性是因为它们处理数字表示有限性的方式不 同—整数的表示虽然只能编码一个相对较小的数值范围，但是这种表示是精确的；而浮
          - paragraph [ref=f1e63]: 第2章 信息的表示和处理 23 点数虽然可以编码一个较大的数值范围，但是这种表示只是近似的。
          - paragraph [ref=f1e64]: 通过研究数字的实际表示，我们能够了解可以表示的值的范围和不同算术运算的属 性。为了使编写的程序能在全部数值范围内正确工作，而且具有可以跨越不同机器、操作 系统和编译器组合的可移植性，了解这种属性是非常重要的。后面我们会讲到，大量计算 机的安全漏洞都是由于计算机算术运算的微妙细节引发的。在早期，当人们碰巧触发了程 序漏洞，只会给人们带来一些不便，但是现在，有众多的黑客企图利用他们能找到的任何 漏洞，不经过授权就进入他人的系统。这就要求程序员有更多的责任和义务，去了解他们 的程序如何工作，以及如何被迫产生不良的行为。
          - paragraph [ref=f1e65]: 计算机用几种不同的二进制表示形式来编码数值。随着第3章进人机器级编程，你需 要熟悉这些表示方式。在本章中，我们描述这些编码，并且教你如何推出数字的表示。
          - paragraph [ref=f1e66]: 通过直接操作数字的位级表示，我们得到了几种进行算术运算的方式。理解这些技术对 于理解编译器产生的机器级代码是很重要的，编译器会试图优化算术表达式求值的性能。
          - paragraph [ref=f1e67]: 我们对这部分内容的处理是基于一组核心的数学原理的。从编码的基本定义开始，然 后得出一些属性，例如可表示的数字的范围、它们的位级表示以及算术运算的属性。我们 相信从这样一个抽象的观点来分析这些内容，对你来说是很重要的，因为程序员需要对计 算机运算与更为人熟悉的整数和实数运算之间的关系有清晰的理解。 旁注 怎样阅读本章 本章我们研究在计算机上如何表示数字和其他形式数据的基本属性，以及计算机对 这些数据执行操作的属性。这就要求我们深入研究数学语言，编写公式和方程式，以及 展示重要属性的推导。 为了帮助你阅读，这部分内容安排如下：首先给出以数学形式表示的属性，作为原 理。然后，用例子和非形式化的讨论来解释这个原理。我们建议你反复阅读原理描述和 它的示例与讨论，直到你对该属性的说明内容及其重要性有了牢固的直觉。对于更加复 杂的属性，还会提供推导，其结构看上去将会像一个数学证明。虽然最终你应该尝试理 解这些推导，但在第一次阅读时你可以跳过它们。 我们也鼓励你在阅读正文的过程中完成练习题，这会促使你主动学习，帮助你理论联 系实际。有了这些例题和练习题作为背景知识，再返回推导，你将发现理解起来会容易许 多。同时，请放心，掌握好高中代数知识的人都具备理解这些内容所需要的数学技能。
          - paragraph [ref=f1e68]: C++ 编程语言建立在C语言基础之上，它们使用完全相同的数字表示和运算。本章 中关于C的所有内容对C++都有效。另一方面，Java 语言创造了一套新的数字表示和运 算标准。C标准的设计允许多种实现方式，而Java 标准在数据的格式和编码上是非常精确 具体的。本章中多处着重介绍了Java 支持的表示和运算。 旁注 C编程语言的演变 前面提到过，C编程语言是贝尔实验室的 Dennis Ritchie 最早开发出来的，目的是 和 Unix 操作系统一起使用（Unix 也是贝尔实验室开发的）。在那个时候，大多数系统程 序，例如操作系统，为了访问不同数据类型的低级表示，都必须大量地使用汇编代码。 比如说，像 malloc 库函数提供的内存分配功能，用当时的其他高级语言是无法编写的。 Brian Kernighan 和 Dennis Ritchie 的著作的第1版［60］记录了最初贝尔实验室的C 语言版本。随着时间的推移，经过多个标准化组织的努力，C语言也在不断地演变。1989
          - paragraph [ref=f1e69]: 24 第一部分 程序结构和执行 年，美国国家标准学会下的一个工作组推出了 ANSI C 标准，对最初的贝尔实验室的C 语言做了重大修改。ANSI C与贝尔实验室的C有了很大的不同，尤其是函数声明的方 式。Brian Kernighan 和 Dennis Ritchie 在著作的第2版［61］中描述了 ANSI C，这本书 至今仍被公认为关于C语言最好的参考手册之一。
          - paragraph [ref=f1e70]: 国际标准化组织接替了对C语言进行标准化的任务，在1990年推出了一个几乎和 ANSI C一样的版本，称为“ISO C90”。该组织在1999年又对C语言做了更新，推出 “ISO C99”。在这一版本中，引入了一些新的数据类型，对使用不符合英语语言字符的 文本字符串提供了支持。更新的版本2011年得到批准，称为“ISO C11”，其中再次添 加了更多的数据类型和特性。最近增加的大多数内容都可以向后兼容，这意味着根据早 期标准（至少可以回溯到 ISO C9O）编写的程序按新标准编译时会有同样的行为。
          - paragraph [ref=f1e71]: GNU 编译器套装（GNU Compiler Collec- C版本 GCC命令行选项 tion,GCC）可以基于不同的命令行选项，依照 GNU 89 无，-std=gnu89 多个不同版本的C语言规则来编译程序，如图2- ANSI, ISO C90 -ansi，-std=c89 1所示。比如，根据ISO C11 来编译程序 prog. ISO C99 -std=c99 c，我们就使用命令行： ISO C11 -std=c11 1inux>gcc -std=c11 prog.c 图 2-1 向 GCC指定不同的C语言版本 编译选项-ansi 和-std=c89的用法是一样的—会根据 ANSI 或者 ISO C90标准来编 译程序。（C90有时也称为“C89”，这是因为它的标准化工作是从1989年开始的。）编译 选项-std=c99会让编译器按照 ISO C99的规则进行编译。 本书中，没有指定任何编译选项时，程序会按照基于ISO C90的C语言版本进行编 译，但是也包括一些C99、C11的特性，一些C++的特性，还有一些是与GCC 相关的 特性。GNU 项目正在开发一个结合了 ISO CI1和其他一些特性的版本，可以通过命令行 选项-std=gnu11来指定。（目前，这个实现还未完成。）今后，这个版本会成为默认的版本。 2.1 信息存储 大多数计算机使用8位的块，或者字节（byte），作为最小的可寻址的内存单位，而不 是访问内存中单独的位。机器级程序将内存视为一个非常大的字节数组，称为虚拟内存 （virtual memory）。内存的每个字节都由一个唯一的数字来标识，称为它的地址（ad- dress），所有可能地址的集合就称为虚拟地址空间（virtual address space）。顾名思义，这 个虚拟地址空间只是一个展现给机器级程序的概念性映像。实际的实现（见第9章）是将动 态随机访问存储器（DRAM）、闪存、磁盘存储器、特殊硬件和操作系统软件结合起来，为 程序提供一个看上去统一的字节数组。
          - paragraph [ref=f1e72]: 在接下来的几章中，我们将讲述编译器和运行时系统是如何将存储器空间划分为更可 管理的单元，来存放不同的程序对象（program object），即程序数据、指令和控制信息。 可以用各种机制来分配和管理程序不同部分的存储。这种管理完全是在虚拟地址空间里完 成的。例如，C语言中一个指针的值（无论它指向一个整数、一个结构或是某个其他程序 对象）都是某个存储块的第一个字节的虚拟地址。C编译器还把每个指针和类型信息联系 起来，这样就可以根据指针值的类型，生成不同的机器级代码来访问存储在指针所指向位置 处的值。尽管C编译器维护着这个类型信息，但是它生成的实际机器级程序并不包含关于数 据类型的信息。每个程序对象可以简单地视为一个字节块，而程序本身就是一个字节序列。
          - paragraph [ref=f1e73]: 第2章 信息的表示和处理 25 给C语言初学者 C语言中指针的作用 指针是C语言的一个重要特性。它提供了引用数据结构（包括数组）的元素的机制。 与变量类似，指针也有两个方面：值和类型。它的值表示某个对象的位置，而它的类型 表示那个位置上所存储对象的类型（比如整数或者浮点数）。 真正理解指针需要查看它们在机器级上的表示以及实现。这将是第3章的重点之 一，3.10.1节将对其进行深入介绍。 2.1.1 十六进制表示法 一个字节由8位组成。在二进制表示法中，它的值域是 00000000~111111112。如果看 成十进制整数，它的值域就是0o~2551o。两种符号表示法对于描述位模式来说都不是非常 方便。二进制表示法太冗长，而十进制表示法与位模式的互相转化很麻烦。替代的方法是， 以16 为基数，或者叫做十六进制（hexadecimal）数，来表示位模式。十六进制（简写为 “hex”） 使用数字‘0’～‘9’以及字符‘A’～‘F’来表示16个可能的值。图2-2展示了16个十 六进制数字对应的十进制值和二进制值。用十六进制书写，一个字节的值域为 0016~FF16。 十六进制数字 十进制值 二进制值 十六进制数字 十进制值 二进制值 0 0 0000 8 8 1000 1 1 0001 9 9 1001 2 2 0010 A 10 1010 3 3 0011. B 11 1011. 4 4 0100 C 12 1100 6 0101 D 13 1101 0110 7 7 0111 14 1110 15 1111 图 2-2 十六进制表示法。每个十六进制数字都对16 个值中的一个进行了编码
          - paragraph [ref=f1e74]: 在C语言中，以 Ox 或 Ox 开头的数字常量被认为是十六进制的值。字符‘A’～‘F’ 既可以是大写，也可以是小写。例如，我们可以将数字 FA1D37B16写作 OxFA1D37B，或者 0xfa1d37b，甚至是大小写混合，比如，OxFa1D37b。在本书中，我们将使用C表示法来 表示十六进制值。
          - paragraph [ref=f1e75]: 编写机器级程序的一个常见任务就是在位模式的十进制、二进制和十六进制表示之间 人工转换。二进制和十六进制之间的转换比较简单直接，因为可以一次执行一个十六进制 数字的转换。数字的转换可以参考如图2-2所示的表。一个简单的窍门是，记住十六进制 数字 A、C和F相应的十进制值。而对于把十六进制值B、D和E转换成十进制值，则可 以通过计算它们与前三个值的相对关系来完成。
          - paragraph [ref=f1e76]: 比如，假设给你一个数字 Ox173A4C。可以通过展开每个十六进制数字，将它转换 二进制格式，如下所示： 十六进制 1 7 3 A 二进制 0001 0111 0011 1010 4 0100 C 1100
          - paragraph [ref=f1e77]: 这样就得到了二进制表示000101110011101001001100。
          - paragraph [ref=f1e78]: 反过来，如果给定一个二进制数字1111001010110110110011，可以通过首先把它分为 每4位一组来转换为十六进制。不过要注意，如果位总数不是4的倍数，最左边的一组可 以少于4位，前面用0补足。然后将每个4位组转换为相应的十六进制数字： 二进制 11 1100 1010 1101 1011 0011 十六进制 3 c A D B 3 C练习题2.1 完成下面的数字转换：
          - paragraph [ref=f1e79]: 26 第一部分 程序结构和执行 A.将Ox39A7F8转换为二进制。
