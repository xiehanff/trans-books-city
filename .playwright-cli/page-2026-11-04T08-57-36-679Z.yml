          - paragraph [ref=f4e962]: 我们会进行一组变换，发现有很多只能带来很小的性能提高，而其他的能带来更巨大 的效果。确定该使用哪些变换组合确实是编写快速代码的“魔术（black art）”。有些不能 提供可测量的好处的组合确实是无效的，然而有些组合是很重要的，它们使编译器能够进 一步优化。根据我们的经验，最好的方法是实验加上分析：反复地尝试不同的方法，进行 测量，并检查汇编代码表示以确定底层的性能瓶颈。
