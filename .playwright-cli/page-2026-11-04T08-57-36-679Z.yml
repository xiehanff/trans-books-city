          - paragraph [ref=f4e1170]: 剖析报告的第一部分列出了执行各个函数花费的时间，按照降序排列。作为一个示 例，下面列出了报告的一部分，是关于程序中最耗费时间的三个函数的： % cumulative time seconds 97.58 203.66 2.32 208.50 0.14 208.81 self seconds Calls 203.66 1 4.85 965027 0.30 12511031 self total s/call S/Cal1 name 203.66 203.66 sort_words 0.00 0.00 find_ele_rec 0.00 0.00 Strlen 每一行代表对某个函数的所有调用所花费的时间。第一列表明花费在这个函数上的时 间占整个时间的百分比。第二列显示的是直到这一行并包括这一行的函数所花费的累计时 间。第三列显示的是花费在这个函数上的时间，而第四列显示的是它被调用的次数（递归 调用不计算在内）。在例子中，函数 sort_words 只被调用了一次，但就是这一次调用需 要203.66秒，而函数 find_ele_rec 被调用了965 027次（递归调用不计算在内），总共需 要4.85秒。函数 Strlen通过调用库函数 strlen 来计算字符串的长度。GPROF 的结果 中通常不显示库函数调用。库函数耗费的时间通常计算在调用它们的函数内。通过创建这 个“包装函数（wrapper function）”strlen，我们可以可靠地跟踪对 strlen 的调用，表 明它被调用了12511031次，但是一共只需要0.30秒。
