          - paragraph [ref=f4e1182]: 第5草 优化程序性能 391 法使花在排序上的时间降低到可以忽略不计，而整个运行时间降低到大约5.4秒。图 5-38b 是剩下各个版本的时间，所用的比例能使我们看得更清楚。 250 200 秒150 100 50 口 Sort • List 口 Lower 園 Strlen Hash Rest Initial Quicksort Iter first Iter last a ）所有的版本 Big table Better hash Linear lower 6 5 4 3 2 口 Sort List Lower 國 Strlen 目 Hash m Rest 0 Quicksort Iter first Iter last Big table Better hash Linear lower b）除了最慢的版本外的所有版本 图5-38 bigram 频度计数程序的各个版本的剖析结果。时间是根据程序中不同的主要操作划分的 •改进了排序，现在发现链表扫描变成了瓶颈。想想这个低效率是由于函数的递归结构 引起的，我们用一个迭代的结构替换它，显示 “Iter first” ’。令人奇怪的是，运行时间增 加到了大约7.5秒。根据更近一步的研究，我们发现两个链表函数之间有一个细微的差 别。递归版本将新元素插入到链表尾部，而迭代版本把它们插到链表头部。为了使性能最 大化，我们希望频率最高的n-gram 出现在链表的开始处。这样一来，函数就能快速地定 位常见的情况。假设 n-gram 在文档中是均匀分布的，我们期望频度高的单词的第一次出 现在频度低的单词之前。通过将新的n-gram 插人尾部，第一个函数倾向于按照频度的降 序排序，而第二个函数则相反。因此我们创建第三个链表扫描函数，它使用迭代，但是将 新元素插人到链表的尾部。使用这个版本，显示为 “Iter last”，时间降到了大约5.3秒， 比递归版本稍微好一点。这些测量展示了对程序做实验作为优化工作一部分的重要性。开 始时，我们假设将递归代码转换成迭代代码会改进程序的性能，而没有考虑添加元素到链 表末尾和开头的差别。
