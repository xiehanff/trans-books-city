          - heading "平台边界与工程闭环" [level=2] [ref=e315]
          - paragraph [ref=e316]: 本规划面向 Android Jetpack Compose。学习者需要额外补齐真实项目通常会遇到、但本仓库没有展开成完整章节的内容：模块化、国际化/RTL、表单焦点与 IME、崩溃和 ANR 监控。网络请求、DTO 与分页原属此列，现已由实践篇（第 81—87 章）以真实接口小项目展开；Repository 多层抽象、模块化等工程化议题仍留给读者在真实项目中补齐。第 68—80 章后的综合项目会把适合本课程的内容作为验收约束；单个 API 示例不应被当作生产方案。
          - paragraph [ref=e317]: 第 45 章后先完成基础篇阶段验收：使用第 1—45 章学过的布局、导航、本地状态、表单、状态恢复和设计稿适配，随界面一起检查已学的内容 padding 与图片语义。工程化和综合质量验收安排在第 68—80 章学习后。
          - paragraph [ref=e318]:
            - text: 进入进阶篇后，按 46—67、68—73、74—80 章逐步扩展练习。完成第 80 章后，可以跟做实践篇（第 81—87 章）的小电商闭环，再做
            - link "阶段项目：电商商城" [ref=e319] [cursor=pointer]:
              - /url: "#%E9%98%B6%E6%AE%B5%E9%A1%B9%E7%9B%AE_%E7%94%B5%E5%95%86%E5%95%86%E5%9F%8E.md"
            - text: 独立验收——同一个商城，任务书要求脱离教程完成并叠加质量验收。
          - heading "进阶篇学习建议" [level=2] [ref=e320]
          - list [ref=e321]:
            - listitem [ref=e322]: 46—50 章是地基：不理解重组与稳定性，后续性能章节无从谈起。
            - listitem [ref=e323]: 51—56 章动画建议配合真机运行观察曲线差异；57—61 章绘制建议动手改参数观察效果。
            - listitem [ref=e324]: 62—67 章是「框架边界」：自定义布局、手势与互操作决定了你能走多远。
            - listitem [ref=e325]: 68—73 章进入工程化：架构、注入、生命周期与数据层，是进阶与高级的分水岭。
            - listitem [ref=e326]: 74—80 章是「高级」的验收标准：能测量、能优化、能测试、能发布。
            - listitem [ref=e327]: 81—87 章是实践篇：不再讲新 API，而是把前 80 章的能力串成产品——建议严格按章序完成完整闭环，每章末尾的验收标准全部通过再前进。
