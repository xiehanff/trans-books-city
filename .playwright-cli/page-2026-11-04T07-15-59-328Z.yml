          - paragraph [ref=e162]: 完成标准不是“看过”，而是：
          - list [ref=e163]:
            - listitem [ref=e164]: 模板 Compose 项目能在 Android Studio 和命令行构建；
            - listitem [ref=e165]:
              - text: 能使用
              - code [ref=e166]: ./gradlew :app:assembleDebug --stacktrace --console=plain
              - text: 复现失败；
            - listitem [ref=e167]: 能解释第一个失败任务、第一条有效根因和构建工具版本；
            - listitem [ref=e168]: 能区分构建失败、安装失败和运行时崩溃。
            - listitem [ref=e169]: 能读懂 val/var、空安全、Lambda、data class、sealed 状态、委托和基础协程；
            - listitem [ref=e170]: 能解释 Manifest、资源、Activity、ViewModel、Composition 与进程的关系。
          - heading "已有 Android/Gradle 经验" [level=3] [ref=e171]
          - paragraph [ref=e172]: 可以直接从第 1 章开始，但遇到构建、依赖或版本兼容问题时回到预备篇 B、C。
          - heading "有 Flutter 经验" [level=3] [ref=e173]
          - paragraph [ref=e174]: 每章的 Flutter/Dart 对照可以帮助迁移已有概念。没有 Flutter 经验的读者可以跳过对照部分，不影响 Compose 主线。
          - heading "阅读顺序" [level=2] [ref=e175]
          - paragraph [ref=e176]:
            - text: 章节编号是推荐顺序，不是唯一学习路径。学习者应按“状态与布局”“导航与架构”“性能与发布”等能力组复习，并以每个阶段的验收项目检验是否能把 API 串成完整功能。各部分结束后的短实践见
            - link "阶段实践案例" [ref=e177] [cursor=pointer]:
