          - paragraph [ref=f1e47]: P A 第一部分 R T 程序结构和执行
          - paragraph [ref=f1e48]: 我们对计算机系统的探索是从学习计算机本身开始的，它由 处理器和存储器子系统组成。在核心部分，我们需要方法来表示 基本数据类型，比如整数和实数运算的近似值。然后，我们考虑 机器级指令如何操作这样的数据，以及编译器又如何将C程序翻 译成这样的指令。接下来，研究几种实现处理器的方法，帮助我 们更好地了解硬件资源如何被用来执行指令。一旦理解了编译器 和机器级代码，我们就能了解如何通过编写C程序以及编译它们 来最大化程序的性能。本部分以存储器子系统的设计作为结束， 这是现代计算机系统最复杂的部分之一。
          - paragraph [ref=f1e49]: 本书的这一部分将领着你深入了解如何表示和执行应用程序。 你将学会一些技巧，来帮助你写出安全、可靠且充分利用计算资 源的程序。
          - paragraph [ref=f1e50]: H 第2章 P 信息的表示和处理 R2
          - paragraph [ref=f1e51]: 现代计算机存储和处理的信息以二值信号表示。这些微不足道的二进制数字，或者称 为位（bit），形成了数字革命的基础。大家熟悉并使用了 1000多年的十进制（以10为基数） 起源于印度，在12 世纪被阿拉伯数学家改进，并在13世纪被意大利数学家 Leonardo Pisano（大约公元 1170—1250，更大家所熟知的名字是 Fibonacci）带到西方。对于有10 个手指的人类来说，使用十进制表示法是很自然的事情，但是当构造存储和处理信息的机 器时，二进制值工作得更好。二值信号能够很容易地被表示、存储和传输，例如，可以表 示为穿孔卡片上有洞或无洞、导线上的高电压或低电压，或者顺时针或逆时针的磁场。对 二值信号进行存储和执行计算的电子电路非常简单和可靠，制造商能够在一个单独的硅片 上集成数百万甚至数十亿个这样的电路。
          - paragraph [ref=f1e52]: 孤立地讲，单个的位不是非常有用。然而，当把位组合在一起，再加上某种解释（inter- pretation），即赋予不同的可能位模式以含意，我们就能够表示任何有限集合的元素。比 如，使用一个二进制数字系统，我们能够用位组来编码非负数。通过使用标准的字符码， 我们能够对文档中的字母和符号进行编码。在本章中，我们将讨论这两种编码，以及负数 表示和实数近似值的编码。
          - paragraph [ref=f1e53]: 我们研究三种最重要的数字表示。无符号（unsigned）编码基于传统的二进制表示法， 表示大于或者等于零的数字。补码（two’s-complement）编码是表示有符号整数的最常见的 方式，有符号整数就是可以为正或者为负的数字。浮点数（floating-point）编码是表示实数 的科学记数法的以2为基数的版本。计算机用这些不同的表示方法实现算术运算，例如加 法和乘法，类似于对应的整数和实数运算。
          - paragraph [ref=f1e54]:
            - text: 计算机的表示法是用有限数量的位来对一个数字编码，因此，当结果太大以至不能表 示时，某些运算就会溢出（overflow）。溢出会导致某些令人吃惊的后果。例如，在今天的 大多数计算机上（使用32位来表示数据类型 int），计算表达式 200
