          - paragraph [ref=f1e339]: 在这段代码里，第7行给出的是库函数memcpy 的原型，这个函数是要将一段指定 长度为n的字节从内存的一个区域复制到另一个区域。
          - paragraph [ref=f1e340]: 从第14 行开始的函数 copy_from_kerne1是要将一些操作系统内核维护的数据复 制到指定的用户可以访问的内存区域。对用户来说，大多数内核维护的数据结构应该是 不可读的，因为这些数据结构可能包含其他用户和系统上运行的其他作业的敏感信息， 但是显示为 kbuf的区城是用户可以读的。参数maxlen 给出的是分配给用户的缓冲区 的长度，这个缓冲区是用参数 user_dest 指示的。然后，第16 行的计算确保复制的字 节数据不会超出源或者目标缓冲区可用的范围。
          - paragraph [ref=f1e341]: 不过，假设有些怀有恶意的程序员在调用 copY_from_kernel 的代码中对 maxlen 使用了负数值，那么，第16 行的最小值计算会把这个值赋给 len，然后len会作为参 数n被传递给 memcpy。不过，请注意参数n是被声明为数据类型size_t的。这个数据 类型是在库文件 stdio.h中（通过 typedef）被声明的。典型地，对32位程序它被定义 为unsigned int，对64位程序定义为 unsigned long。既然参数n是无符号的，那么 memcpy 会把它当作一个非常大的正整数，并且试图将这样多字节的数据从内核区域复 制到用户的缓冲区。虽然复制这么多字节（至少23个）实际上不会完成，因为程序会遇 到进程中非法地址的错误，但是程序还是能读到它没有被授权的内核内存区域。
          - paragraph [ref=f1e342]: 我们可以看到，这个问题是由于数据类型的不匹配造成的：在一个地方，长度参数 是有符号数；而另一个地方，它又是无符号数。正如这个例子表明的那样，这样的不匹 配会成为缺陷的原因，甚至会导致安全漏洞。幸运的是，还没有案例报告有程序员在 FreeBSD上利用了这个漏洞。他们发布了一个安全建议，“FreeBSD-SA-02:38.signed- errOr” ，建议系统管理员如何应用补丁消除这个漏洞。要修正这个缺陷，只要将 copY_ from
          - paragraph [ref=f1e343]: _kernel的参数 maxlen 声明为类型 size_t，也就是与memcpy的参数n一致。同 时，我们也应该将本地变量 len和返回值声明为 size_t。
