          - paragraph [ref=e339]: 完成实践篇后，你应能独立完成「网络层 → 分页列表 → 详情/SKU → 可变集合 → 信息聚合 → 导航整合」的完整闭环：用 Retrofit 接真实 HTTP 接口并处理统一响应壳，首页分页/筛选/下拉刷新可用，商品详情 SKU 匹配与评论分页正确，购物车增删改与三态处理打真实接口，底部导航与角标联动；替换 mock 为任意真实后端时，能说清 BASE_URL、DTO、响应壳与鉴权各要改什么。
