        - article [ref=f4e887]:
          - heading "第 5 章 优化程序性能" [level=1] [ref=f4e888]
          - paragraph [ref=f4e889]: 第5章 P 优化程序性能 E達 R
          - paragraph [ref=f4e890]: 写程序最主要的目标就是使它在所有可能的情况下都正确工作。一个运行得很快但是 给出错误结果的程序没有任何用处。程序员必须写出清晰简洁的代码，这样做不仅是为了 自己能够看懂代码，也是为了在检查代码和今后需要修改代码时，其他人能够读懂和理解 代码。
          - paragraph [ref=f4e891]: 另一方面，在很多情况下，让程序运行得快也是一个重要的考虑因素。如果一个程序 要实时地处理视频帧或者网络包，一个运行得很慢的程序就不能提供所需的功能。当一个 计算任务的计算量非常大，需要执行数日或者数周，那么哪怕只是让它运行得快20%也会 产生重大的影响。本章会探讨如何使用几种不同类型的程序优化技术，使程序运行得 更快。
          - paragraph [ref=f4e892]: 编写高效程序需要做到以下几点：第一，我们必须选择一组适当的算法和数据结构。 第二，我们必须编写出编译器能够有效优化以转换成高效可执行代码的源代码。对于这第 二点，理解优化编译器的能力和局限性是很重要的。编写程序方式中看上去只是一点小小 的变动，都会引起编译器优化方式很大的变化。有些编程语言比其他语言容易优化。C语 言的有些特性，例如执行指针运算和强制类型转换的能力，使得编译器很难对它进行优 化。程序员经常能够以一种使编译器更容易产生高效代码的方式来编写他们的程序。第三 项技术针对处理运算量特别大的计算，将一个任务分成多个部分，这些部分可以在多核和 多处理器的某种组合上并行地计算。我们会把这种性能改进的方法推迟到第12章中去讲。 即使是要利用并行性，每个并行的线程都以最高性能执行也是非常重要的，所以无论如何 本章所讲的内容也还是有意义的。
          - paragraph [ref=f4e893]: 在程序开发和优化的过程中，我们必须考虑代码使用的方式，以及影响它的关键因 素。通常，程序员必须在实现和维护程序的简单性与它的运行速度之间做出权衡。在算法 级上，几分钟就能编写一个简单的插人排序，而一个高效的排序算法程序可能需要一天或 更长的时间来实现和优化。在代码级上，许多低级别的优化往往会降低程序的可读性和模 块性，使得程序容易出错，并且更难以修改或扩展。对于在性能重要的环境中反复执行的 代码，进行大量的优化会比较合适。一个挑战就是尽管做了大量的变化，但还是要维护代 码一定程度的简洁和可读性。
          - paragraph [ref=f4e894]: 我们描述许多提高代码性能的技术。理想的情况是，编译器能够接受我们编写的任何 代码，并产生尽可能高效的、具有指定行为的机器级程序。现代编译器采用了复杂的分析 和优化形式，而且变得越来越好。然而，即使是最好的编译器也受到妨碍优化的因素 （optimization blocker）的阻碍，妨碍优化的因素就是程序行为中那些严重依赖于执行环境 的方面。程序员必须编写容易优化的代码，以帮助编译器。
          - paragraph [ref=f4e895]: 程序优化的第一步就是消除不必要的工作，让代码尽可能有效地执行所期望的任务。 这包括消除不必要的函数调用、条件测试和内存引用。这些优化不依赖于目标机器的任何 具体属性。
          - paragraph [ref=f4e896]: 为了使程序性能最大化，程序员和编译器都需要一个目标机器的模型，指明如何处理指
          - paragraph [ref=f4e897]: 342 第一部分 程序结构和执行 令，以及各个操作的时序特性。例如，编译器必须知道时序信息，才能够确定是用一条乘法 指令，还是用移位和加法的某种组合。现代计算机用复杂的技术来处理机器级程序，并行地 执行许多指令，执行顺序还可能不同于它们在程序中出现的顺序。程序员必须理解这些处理 器是如何工作的，从而调整他们的程序以获得最大的速度。基于 Intel 和AMD处理器最近的 设计，我们提出了这种机器的一个高级模型。我们还设计了一种图形数据流（data-flow）表示 法，可以使处理器对指令的执行形象化，我们还可以利用它预测程序的性能。 了解了处理器的运作，我们就可以进行程序优化的第二步，利用处理器提供的指令级并 行（instruction-level parallelism）能力，同时执行多条指令。我们会讲述几个对程序的变化，降 低一个计算的不同部分之间的数据相关，增加并行度，这样就可以同时执行这些部分了。
          - paragraph [ref=f4e898]: 我们以对优化大型程序的问题的讨论来结束这一章。我们描述了代码剖析程序（profi- ler）的使用，代码剖析程序是测量程序各个部分性能的工具。这种分析能够帮助找到代码 中低效率的地方，并且确定程序中我们应该着重优化的部分。
          - paragraph [ref=f4e899]: 在本章的描述中，我们使代码优化看起来像按照某种特殊顺序，对代码进行一系列转 换的简单线性过程。实际上，这项工作远非这么简单。需要相当多的试错法试验。当我们 进行到后面的优化阶段时，尤其是这样，到那时，看上去很小的变化会导致性能上很大的 变化。相反，一些看上去很有希望的技术被证明是无效的。正如后面的例子中会看到的那 样，要确切解释为什么某段代码序列具有特定的执行时间，是很困难的。性能可能依赖于 处理器设计的许多细节特性，而对此我们所知甚少。这也是为什么要尝试各种技术的变形 和组合的另一个原因。
          - paragraph [ref=f4e900]: 研究程序的汇编代码表示是理解编译器以及产生的代码会如何运行的最有效手段之 一。仔细研究内循环的代码是一个很好的开端，识别出降低性能的属性，例如过多的内存 引用和对寄存器使用不当。从汇编代码开始，我们还可以预测什么操作会并行执行，以及 它们会如何使用处理器资源。正如我们会看到的，常常通过确认关键路径（critical path）来 决定执行一个循环所需要的时间（或者说，至少是一个时间下界）。所谓关键路径是在循环 的反复执行过程中形成的数据相关链。然后，我们会回过头来修改源代码，试着控制编译 器使之产生更有效率的实现。
          - paragraph [ref=f4e901]: 大多数编译器，包括GCC，一直都在更新和改进，特别是在优化能力方面。一个很 有用的策略是只重写程序到编译器由此就能产生有效代码所需要的程度就好了。这样，能 尽量避免损害代码的可读性、模块性和可移植性，就好像我们使用的是具有最低能力的编 译器。同样，通过测量值和检查生成的汇编代码，反复修改源代码和分析它的性能是很有 帮助的。
          - paragraph [ref=f4e902]: 对于新手程序员来说，不断修改源代码，试图欺骗编译器产生有效的代码，看起来很 奇怪，但这确实是编写很多高性能程序的方式。比较于另一种方法—用汇编语言写代 码，这种间接的方法具有的优点是：虽然性能不一定是最好的，但得到的代码仍然能够在 其他机器上运行。 5.1 优化编译器的能力和局限性 现代编译器运用复杂精细的算法来确定一个程序中计算的是什么值，以及它们是被如 何使用的。然后会利用一些机会来简化表达式，在几个不同的地方使用同一个计算，以及 降低一个给定的计算必须被执行的次数。大多数编译器，包括GCC，向用户提供了一些 对它们所使用的优化的控制。就像在第3章中讨论过的，最简单的控制就是指定优化级
          - paragraph [ref=f4e903]: 第5章 优化程序性能 343 别。例如，以命令行选项“-Og”调用GCC是让GCC使用一组基本的优化。以选项“-O1”或更高（如“-O2”或“-O3”）调用GCC会让它使用更大量的优化。这样做可以进一步 提高程序的性能，但是也可能增加程序的规模，也可能使标准的调试工具更难对程序进行 调试。我们的表述，虽然对于大多数使用GCC的软件项目来说，优化级别-O2已经成为 了被接受的标准，但是还是主要考虑以优化级别-O1编译出的代码。我们特意限制了优化 级别，以展示写C语言函数的不同方法如何影响编译器产生代码的效率。我们会发现可以 写出的C代码，即使用-O1选项编译得到的性能，也比用可能的最高的优化等级编译一个 更原始的版本得到的性能好。
          - paragraph [ref=f4e904]:
            - text: 编译器必须很小心地对程序只使用安全的优化，也就是说对于程序可能遇到的所有可 能的情况，在C语言标准提供的保证之下，优化后得到的程序和未优化的版本有一样的行 为。限制编译器只进行安全的优化，消除了造成不希望的运行时行为的一些可能的原因， 但是这也意味着程序员必须花费更大的力气写出编译器能够将之转换成有效机器代码的程 序。为了理解决定一种程序转换是否安全的难度，让我们来看看下面这两个过程： 1 void twiddle1（long *xp, long *yp） 2 ｛ 3 4 *xP += *yP； *xp += *yP； 5 ｝ 6 7 void twiddle2（long *xp, long *yp） 8 ｛ 9
