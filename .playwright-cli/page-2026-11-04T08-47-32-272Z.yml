          - paragraph [ref=f1e347]: 许多刚入门的程序员非常惊奇地发现，两个正数相加会得出一个负数，而比较表达式 x<y和比较表达式 x-y<0会产生不同的结果。这些属性是由于计算机运算的有限性造成的。 理解计算机运算的细微之处能够帮助程序员编写更可靠的代码。 2.3.1 无符号加法 考虑两个非负整数z和y，满足0≤z，y<2”。每个数都能表示为w位无符号数字。然而， 如果计算它们的和，我们就有一个可能的范围O≤ 十 2 +1 2。表示这个和可能需要w+1 位。例如，图2-21展示了当z和有4位表示时，函数z十y的坐标图。参数（显示在水平轴 上）取值范围为0~15，但是和的取值范围为0~30。函数的形状是一个有坡度的平面（在两个维 度上，函数都是线性的）。如果保持和为一个 2+1位的数字，并且把它加上另外一个数值，我 们可能需要w+2个位，以此类推。这种持续的“字长膨胀”意味着，要想完整地表示算术运 算的结果，我们不能对字长做任何限制。一些编程语言，例如 Lisp，实际上就支持无限精度的 运算，允许任意的（当然，要在机器的内存限制之内）整数运算。更常见的是，编程语言支持固 定精度的运算，因此像“加法”和“乘法”这样的运算不同于它们在整数上的相应运算。 32 28 24 20 16 12 8 0 14 12 10 8 10 12 14 图 2-21 整数加法。对于一个4位的字长，其和可能需要5位
