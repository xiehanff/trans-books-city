          - paragraph [ref=f4e1041]: 正如我们会看到的，循环寄存器之间的操作链决定了限制性能的数据相关。 图5-14是对图5-13的图形化表示的进一步改进，目标是只给出影响程序执行时间的操 作和数据相关。在图5-14a 中看到，我们重新排列了操作符，更清晰地表明了从顶部源寄存 器（只读寄存器和循环寄存器）到底部目的寄存器（只写寄存器和循环寄存器）的数据流。 各xmmO %rax grd× 1oad %xmmO %rdx data ［i］ load mul add mul add cmp jne &xmmO &xmmO %id× a） 重新排列了图5-13的操作符， b） 操作在一次迭代中使用某些值， 更清晰地表明了数据相关 产生出在下一次迭代中需要的新值 图5-14 将 combine4 的操作抽象成数据流图
          - paragraph [ref=f4e1042]: 在图5-14a 中，如果操作符不属于某个循 环寄存器之间的相关链，那么就把它们标识成 白色。例如，比较（cmp）和分支（jne）操作不直 接影响程序中的数据流。假设指令控制单元预 测会选择分支，因此程序会继续循环。比较和 分支操作的目的是测试分支条件，如果不选择 分支的话，就通知ICU。我们假设这个检查能 够完成得足够快，不会减慢处理器的执行。
          - paragraph [ref=f4e1043]: 在图5-14b中，消除了左边标识为白色的 操作符，而且只保留了循环寄存器。剩下的 是一个抽象的模板，表明的是由于循环的一 次迭代在循环寄存器中形成的数据相关。在 这个图中可以看到，从一次迭代到下一次迭 代有两个数据相关。在一边，我们看到存储 在寄存器%xmm0中的程序值 acc 的连续的值之 间有相关。通过将 acc 的旧值乘以一个数据 元素，循环计算出 acc的新值，这个数据元素 是由1oad操作产生的。在另一边，我们看到循 环索引i的连续的值之间有相关。每次迭代中， 主的旧值用来计算1oad 操作的地址，然后 add 操作也会增加它的值，计算出新值。 图5-15 给出了函数 combine4 内循环的n 次迭代的数据流表示。可以看出，简单地重 关键路径 datat0］ load mul add data［1］ load mul add data［n-2］ load mu. add data［n-1］ Ioad mul add 图5-15 combine4 的内循环的n次迭代计算的 数据流表示。乘法操作的序列形成了限 制程序性能的关键路径
          - paragraph [ref=f4e1044]: 第5章 优化程序性能 365 复图5-14 右边的模板n次，就能得到这张图。我们可以看到，程序有两条数据相关链， 分别对应于操作 mul 和 add 对程序值 acc和 datati 的修改。假设浮点乘法延迟为5个周 期，而整数加法延迟为1个周期，可以看到左边的链会成为关键路径，需要 5n 个周期执 行。右边的链只需要n个周期执行，因此，它不会制约程序的性能。 图5-15说明在执行单精度浮点乘法时，对于 combine4，为什么我们获得了等于5个周 期延迟界限的CPE。当执行这个函数时，浮点乘法器成为了制约资源。循环中需要的其他操 作—控制和测试指针值 data+i，以及从内存中读数据与乘法器并行地进行。每次后继的 acc的值被计算出来，它就反馈回来计算下一个值，不过只有等到5个周期后才能完成。
          - paragraph [ref=f4e1045]: 其他数据类型和运算组合的数据流与图 5-15所示的内容一样，只是在左边的形成数 据相关链的数据操作不同。对于所有情况，如果运算的延迟，L大于1，那么可以看到测 量出来的CPE 就是L，表明这个链是制约性能的关键路径。 2. 其他性能因素 另一方面，对于整数加法的情况，我们对 combine4 的测试表明CPE 为1.27，而根 据沿着图5-15中左边和右边形成的相关链预测的CPE 为1.00，测试值比预测值要慢。这 说明了一个原则，那就是数据流表示中的关键路径提供的只是程序需要周期数的下界。还 有其他一些因素会限制性能，包括可用的功能单元的数量和任何一步中功能单元之间能够 传递数据值的数量。对于合并运算为整数加法的情况，数据操作足够快，使得其他操作供 应数据的速度不够快。要准确地确定为什么程序中每个元素需要1.27个周期，需要比公 开可以获得的更详细的硬件设计知识。
          - paragraph [ref=f4e1046]: 总结一下 combine4的性能分析：我们对程序操作的抽象数据流表示说明，combine4 的关键路径长L•n是由对程序值 acc 的连续更新造成的，这条路径将CPE 限制最多 L。除了整数加法之外，对于所有的其他情况，测量出的CPE 确实等于L，对于整数加 法，测量出的CPE 为1.27而不是根据关键路径的长度所期望的1.00。
