          - paragraph [ref=f4e1172]: 根据这个调用信息，我们通常可以推断出关于程序行为的有用信息。例如，函数 find_ele_rec 是一个递归过程，它扫描一个哈希桶（hash bucket）的链表，查找一个特殊 的字符串。对于这个函数，比较递归调用的数量和顶层调用的数量，提供了关于遍历这些 链表的长度的统计信息。这里递归与顶层调用的比率是164.4，我们可以推断出程序每次 平均大约扫描164个元素。
          - paragraph [ref=f4e1173]: GPROF 有些属性值得注意： • 计时不是很准确。它的计时基于一个简单的间隔计数（interval counting）机制，编译过 的程序为每个函数维护一个计数器，记录花费在执行该函数上的时间。操作系统使得 每隔某个规则的时间间隔8，程序被中断一次。。的典型值的范围1.0～10.0毫秒。 当中断发生时，它会确定程序正在执行什么函数，并将该函数的计数器值增加。。当 然，也可能这个函数只是刚开始执行，而很快就会完成，却赋给它从上次中断以来整个 的执行花费。在两次中断之间也可能运行其他某个程序，却因此根本没有计算花费。 对于运行时间较长的程序，这种机制工作得相当好。从统计上来说，应该根据 花费在执行函数上的相对时间来计算每个函数的花费。不过，对于那些运行时间少 于1秒的程序来说，得到的统计数字只能看成是粗略的估计值。
          - paragraph [ref=f4e1174]: 390 第一部分 程序结构和执行 • 假设没有执行内联替换，则调用信息相当可靠。编译过的程序为每对调用者和被调 用者维护一个计数器。每次调用一个过程时，就会对适当的计数器加1。 • 默认情况下，不会显示对库函数的计时。相反，库函数的时间都被计算到调用它们 的函数的时间中。 5.14.2 使用剖析程序来指导优化 作为一个用剖析程序来指导程序优化的示例，我们创建了一个包括几个不同任务和数 据结构的应用。这个应用分析一个文本文档的n-gram统计信息，这里7-gram 是一个出现 在文档中n个单词的序列。对于n=1，我们收集每个单词的统计信息，对于，=2，收集 每对单词的统计信息，以此类推。对于一个给定的n值，程序读一个文本文件，创建一张 互不相同的n-gram 的表，指出每个7-gram 出现了多少次，然后按照出现次数的降序对单 词排序。 作为基准程序，我们在一个由《莎士比亚全集》组成的文件上运行这个程序，一共有 965 028个单词，其中23706个是互不相同的。我们发现，对于n=1，即使是一个写得很 烂的分析程序也能在1秒以内处理完整个文件，所以我们设置，=2，使得事情更加有挑 战。对于，=2的情况，n-gram 被称为 bigram（读作“bye-gram”）。我们确定《莎士比亚全 集》包含363039个互不相同的bigram。最常见的是“Iam” '，出现了1892次。词组“to be”出现了1020次。bigram 中有266018 个只出现了一次。 程序是由下列部分组成的。我们创建了多个版本，从各部分简单的算法开始，然后再 换成更成熟完善的算法： 1）从文件中读出每个单词，并转换成小写字母。我们最初的版本使用的是函数 1owerl （图5-7），我们知道由于反复地调用 strlen，它的时间复杂度是二次的。 2）对字符串应用一个哈希函数，为一个有s个桶（bucket）的哈希表产生一个0~s-1 之间的数。最初的函数只是简单地对字符的 ASCII 代码求和，再对s求模。 3）每个哈希桶都组织成一个链表。程序沿着这个链表扫描，寻找一个匹配的条目。 如果找到了，这个n-gram 的频度就加1。否则，就创建一个新的链表元素。最初的版本递 归地完成这个操作，将新元素插在链表尾部。 4）一旦已经生成了这张表，我们就根据频度对所有的元素排序。最初的版本使用插人 排序。 图5-38是n-gram频度分析程序6个不同版本的剖析结果。对于每个版本，我们将时 间分为下面的5类。
