          - paragraph [ref=f1e566]: 当在int、float 和 double 格式之间进行强制类型转换时，程序改变数值和位模式 的原则如下（假设 int 是32位的）： • 从int 转换成 float，数字不会溢出，但是可能被舍人。 • 从int或float 转换成 double，因力 double 有更大的范围（也就是可表示值的范 围），也有更高的精度（也就是有效位数），所以能够保留精确的数值。 • 从 double转换成 f1oat，因为范围要小一些，所以值可能溢出成十∞或一∞。另 外，由于精确度较小，它还可能被舍人。 • 从float 或者 double 转换成int，值将会向零舍人。例如，1.999 将被转换成1， 而一1.999将被转换成一1。进一步来说，值可能会溢出。C语言标准没有对这种情 况指定固定的结果。与Intel 兼容的微处理器指定位模式［10⋯00］（字长为w时的 TMinw）为整数不确定（integer indefinite）值。一个从浮点数到整数的转换，如果不 能为该浮点数找到一个合理的整数近似值，就会产生这样一个值。因此，表达式 （int）+1e10会得到-21483648，即从一个正值变成了一个负值。
          - paragraph [ref=f1e567]: 第2章 信息的表示和处理 87 旁注 Ariane 5一 一浮点溢出的高昂代价 将大的浮点数转换成整数是一种常见的程序错误来源。1996年6月4日，Ariane 5 火箭初次航行，一个错误便产生了灾难性的后果。发射后仅仅37秒钟，火箭偏离了它 的飞行路径，解体并且爆炸。火箭上载有价值5亿美元的通信卫星。 后来的调查［73，33］显示，控制惯性导航系统的计算机向控制引擎喷嘴的计算机发 送了一个无效数据。它没有发送飞行控制信息，而是送出了一个诊断位模式，表明在将 一个 64 位浮点数转换成16位有符号整数时，产生了溢出。 溢出的值测量的是火箭的水平速率，这比早先的 Ariane 4火箭所能达到的速度高出 了5倍。在设计 Ariane 4 火箭软件时，他们小心地分析了这些数字值，并且确定水平速 率决不会超出一个16位数的表示范围。不幸的是，他们在 Ariane 5 火箭的系统中简单 地重用了这一部分，而没有检查它所基于的假设。
