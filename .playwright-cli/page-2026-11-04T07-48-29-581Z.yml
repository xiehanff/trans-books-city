        - article [ref=f2e821]:
          - heading "附录 A 错误处理" [level=1] [ref=f2e822]
          - heading "A.1 Unix 系统中的错误处理" [level=2] [ref=f2e823]
          - paragraph [ref=f2e824]: 程序员应该总是检查系统级函数返回的错误代码。有许多细微的方式会导致出现错误，只有使用内核能够提供给我们的状态信息才能理解为什么有这样的错误。不幸的是，程序员往往不愿意进行错误检查，因为这使他们的代码变得很庞大，将一行代码变成一个多行的条件语句。错误检查也是很令人迷惑的，因为不同的函数以不同的方式表示错误。
          - paragraph [ref=f2e825]: 在编写本书时，我们面临类似的问题。一方面，我们希望代码示例阅读起来简洁简单；另一方面，我们又不希望给学生们一个错误的印象，以为可以省略错误检查。为了解决这些问题，我们采用了一种基于错误处理包装函数（error-handling wrapper）的方法，这是由 W. Richard Stevens 在他的网络编程教材［110］中最先提出的。
          - paragraph [ref=f2e826]:
            - text: 其思想是，给定某个基本的系统级函数
            - code [ref=f2e827]: foo
            - text: ，我们定义一个有相同参数、只不过开头字母大写了的包装函数
            - code [ref=f2e828]: Foo
            - text: 。包装函数调用基本函数并检查错误。如果包装函数发现了错误，那么它就打印一条信息并终止进程。否则，它返回到调用者。注意，如果没有错误，包装函数的行为与基本函数完全一样。换句话说，如果程序使用包装函数运行正确，那么我们把每个包装函数的第一个字母小写并重新编译，也能正确运行。
          - paragraph [ref=f2e829]:
            - text: 包装函数被封装在一个源文件（
            - code [ref=f2e830]: csapp.c
            - text: ）中，这个文件被编译和链接到每个程序中。一个独立的头文件（
            - code [ref=f2e831]: csapp.h
            - text: ）中包含这些包装函数的函数原型。
          - paragraph [ref=f2e832]:
            - text: 本附录给出了一个关于 Unix 系统中不同种类的错误处理的教程，还给出了不同风格的错误处理包装函数的示例。
            - code [ref=f2e833]: csapp.h
            - text: 和
            - code [ref=f2e834]: csapp.c
            - text: 文件可以从 CS:APP 网站上获得。
          - paragraph [ref=f2e835]: 本书中我们遇到的系统级函数调用使用三种不同风格的返回错误：Unix 风格的、Posix 风格的和 GAI 风格的。
          - heading "1. Unix 风格的错误处理" [level=3] [ref=f2e836]
          - paragraph [ref=f2e837]:
            - text: 像
            - code [ref=f2e838]: fork
            - text: 和
            - code [ref=f2e839]: wait
            - text: 这样 Unix 早期开发出来的函数（以及一些较老的 Posix 函数）的函数返回值既包括错误代码，也包括有用的结果。例如，当 Unix 风格的
            - code [ref=f2e840]: wait
            - text: 函数遇到一个错误（例如没有子进程要回收），它就返回 −1，并将全局变量
            - code [ref=f2e841]: errno
            - text: 设置为指明错误原因的错误代码。如果
            - code [ref=f2e842]: wait
            - text: 成功完成，那么它就返回有用的结果，也就是回收的子进程的 PID。Unix 风格的错误处理代码通常具有以下形式：
          - code [ref=f2e844]: "if ((pid = wait(NULL)) < 0) { fprintf(stderr, \"wait error: %s\\n\", strerror(errno)); exit(0); }"
          - paragraph [ref=f2e845]:
            - code [ref=f2e846]: strerror
            - text: 函数返回某个
            - code [ref=f2e847]: errno
            - text: 值的文本描述。
          - heading "2. Posix 风格的错误处理" [level=3] [ref=f2e848]
          - paragraph [ref=f2e849]: 许多较新的 Posix 函数，例如 Pthread 函数，只用返回值来表明成功（0）或者失败（非 0）。任何有用的结果都返回在通过引用传递进来的函数参数中。我们称这种方法为 Posix
          - paragraph [ref=f2e850]:
            - text: 风格的错误处理。例如，Posix 风格的
            - code [ref=f2e851]: pthread_create
            - text: 函数用它的返回值来表明成功或者失败，而通过引用将新创建的线程的 ID（有用的结果）返回放在它的第一个参数中。Posix 风格的错误处理代码通常具有以下形式：
          - code [ref=f2e853]: "if ((retcode = pthread_create(&tid, NULL, thread, NULL)) != 0) { fprintf(stderr, \"pthread_create error: %s\\n\", strerror(retcode)); exit(0); }"
          - paragraph [ref=f2e854]:
            - code [ref=f2e855]: strerror
            - text: 函数返回
            - code [ref=f2e856]: retcode
            - text: 某个值对应的文本描述。
          - heading "3. GAI 风格的错误处理" [level=3] [ref=f2e857]
          - paragraph [ref=f2e858]:
            - code [ref=f2e859]: getaddrinfo
            - text: （GAI）和
            - code [ref=f2e860]: getnameinfo
            - text: 函数成功时返回零，失败时返回非零值。GAI 错误处理代码通常具有以下形式：
          - code [ref=f2e862]: "if ((retcode = getaddrinfo(host, service, &hints, &result)) != 0) { fprintf(stderr, \"getaddrinfo error: %s\\n\", gai_strerror(retcode)); exit(0); }"
          - paragraph [ref=f2e863]:
            - code [ref=f2e864]: gai_strerror
            - text: 函数返回
            - code [ref=f2e865]: retcode
            - text: 某个值对应的文本描述。
          - heading "4. 错误报告函数小结" [level=3] [ref=f2e866]
          - paragraph [ref=f2e867]: 贯穿本书，我们使用下列错误报告函数来包容不同的错误处理风格：
          - code [ref=f2e869]:
            - generic [ref=f2e870]: "#include \"csapp.h\""
            - text: void unix_error
            - generic [ref=f2e871]: (char *msg)
            - text: ; void posix_error
            - generic [ref=f2e872]: (int code, char *msg)
            - text: ; void gai_error
            - generic [ref=f2e873]: (int code, char *msg)
            - text: ; void app_error
            - generic [ref=f2e874]: (char *msg)
            - text: ;
          - paragraph [ref=f2e875]: 返回：无。
          - paragraph [ref=f2e876]:
            - text: 正如它们的名字表明的那样，
            - code [ref=f2e877]: unix_error
            - text: 、
            - code [ref=f2e878]: posix_error
            - text: 和
            - code [ref=f2e879]: gai_error
            - text: 函数报告 Unix 风格的错误、Posix 风格的错误和 GAI 风格的错误，然后终止。包括
            - code [ref=f2e880]: app_error
            - text: 函数是为了方便报告应用错误。它只是简单地打印它的输入，然后终止。图 A-1 展示了这些错误报告函数的代码。
          - paragraph [ref=f2e881]:
            - code [ref=f2e882]: code/src/csapp.c
          - code [ref=f2e884]:
            - text: void unix_error
            - generic [ref=f2e885]: (char *msg)
            - text: "/* Unix-style error */ { fprintf(stderr, \"%s: %s\\n\", msg, strerror(errno)); exit(0); } void posix_error"
            - generic [ref=f2e886]: (int code, char *msg)
            - text: "/* Posix-style error */ { fprintf(stderr, \"%s: %s\\n\", msg, strerror(code)); exit(0); } void gai_error"
            - generic [ref=f2e887]: (int code, char *msg)
            - text: /* Getaddrinfo-style error */
          - paragraph [ref=f2e888]: 图 A-1 错误报告函数
          - code [ref=f2e890]:
            - text: "{ fprintf(stderr, \"%s: %s\\n\", msg, gai_strerror(code)); exit(0); } void app_error"
            - generic [ref=f2e891]: (char *msg)
            - text: "/* Application error */ { fprintf(stderr, \"%s\\n\", msg); exit(0); }"
          - paragraph [ref=f2e892]:
            - code [ref=f2e893]: code/src/csapp.c
          - paragraph [ref=f2e894]: 图 A-1（续）
          - heading "A.2 错误处理包装函数" [level=2] [ref=f2e895]
          - paragraph [ref=f2e896]: 下面是一些不同错误处理包装函数的示例：
          - list [ref=f2e897]:
            - listitem [ref=f2e898]:
              - text: Unix 风格的错误处理包装函数。图 A-2 展示了 Unix 风格的
              - code [ref=f2e899]: wait
              - text: 函数的包装函数。如果
              - code [ref=f2e900]: wait
              - text: 返回一个错误，包装函数打印一条消息，然后退出。否则，它向调用者返回一个 PID。图 A-3 展示了 Unix 风格的
              - code [ref=f2e901]: kill
              - text: 函数的包装函数。注意，这个函数和
              - code [ref=f2e902]: wait
              - text: 不同，成功时返回
              - code [ref=f2e903]: void
              - text: 。
          - paragraph [ref=f2e904]:
            - code [ref=f2e905]: code/src/csapp.c
          - code [ref=f2e907]:
            - text: pid_t Wait
            - generic [ref=f2e908]: (int *status)
            - text: "{ pid_t pid; if ((pid = wait(status)) < 0) unix_error(\"Wait error\"); return pid; }"
          - paragraph [ref=f2e909]:
            - code [ref=f2e910]: code/src/csapp.c
          - paragraph [ref=f2e911]:
            - text: 图 A-2 Unix 风格的
            - code [ref=f2e912]: wait
            - text: 函数的包装函数
          - paragraph [ref=f2e913]:
            - code [ref=f2e914]: code/src/csapp.c
          - code [ref=f2e916]:
            - text: void Kill
            - generic [ref=f2e917]: (pid_t pid, int signum)
            - text: "{ int rc; if ((rc = kill(pid, signum)) < 0) unix_error(\"Kill error\"); }"
          - paragraph [ref=f2e918]:
            - code [ref=f2e919]: code/src/csapp.c
          - paragraph [ref=f2e920]:
            - text: 图 A-3 Unix 风格的
            - code [ref=f2e921]: kill
            - text: 函数的包装函数
          - list [ref=f2e922]:
