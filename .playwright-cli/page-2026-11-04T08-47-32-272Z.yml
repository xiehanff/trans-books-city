          - paragraph [ref=f1e103]: 注意，在字 Ox01234567中，高位字节的十六进制值为Ox01，而低位字节值为0x67。 •大多数 Intel 兼容机都只用小端模式。另一方面，IBM 和 Oracle（从其2010年收购 Sun Microsystems 开始）的大多数机器则是按大端模式操作。注意我们说的是“大多数”。 这些规则并没有严格按照企业界限来划分。比如，IBM 和 Oracle 制造的个人计算机使用 的是Intel兼容的处理器，因此使用小端法。许多比较新的微处理器是双端法（bi-endian）， 也就是说可以把它们配置成作为大端或者小端的机器运行。然而，实际情况是：一旦选择 了特定操作系统，那么字节顺序也就固定下来。比如，用于许多移动电话的ARM 微处理 器，其硬件可以按小端或大端两种模式操作，但是这些芯片上最常见的两种操作系统—— Android（来自 Google）和IOS（来自 Apple）—却只能运行于小端模式。
          - paragraph [ref=f1e104]: 令人吃惊的是，在哪种字节顺序是合适的这个问题上，人们表现得非常情绪化。实际 上，术语 “little endian（小端）”和 “big endian（大端）”出自 Jonathan Swift 的《格利佛游 记》（Gulliver’s Travels）一书，其中交战的两个派别无法就应该从哪一端（小端还是大端） 打开一个半熟的鸡蛋达成一致。就像鸡蛋的问题一样，选择何种字节顺序没有技术上的理 由，因此争论沦为关于社会政治论题的争论。只要选择了一种规则并且始终如一地坚持， 对于哪种字节排序的选择都是任意的。 旁注 “端”的起源 以下是Jonathan Swift 在1726 年关于大小端之争历史的描述：
          - paragraph [ref=f1e105]: 30 第一部分 程序结构和执行 “••…我下面要告诉你的是，Lilliput 和 Blefuscu 这两大强国在过去36个月里一直 在苦战。战争开始是由于以下的原因：我们大家都认为，吃鸡蛋前，原始的方法是打破 鸡蛋较大的一端，可是当今皇帝的祖父小时候吃鸡蛋，一次按古法打鸡蛋时碰巧将一个 手指弄破了，因此他的父亲，当时的皇帝，就下了一道敕令，命令全体臣民吃鸡蛋时打 破鸡蛋较小的一端，违令者重罚。老百姓们对这项命令极为反感。历史告诉我们，由此 曾发生过六次叛乱，其中一个皇帝送了命，另一个丢了王位。这些叛乱大多都是由Ble- fuscu 的国王大臣们煽动起来的。叛乱平息后，流亡的人总是逃到那个帝国去寻救避难。 据估计，先后几次有11000人情愿受死也不肯去打破鸡蛋较小的一端。关于这一争端， 曾出版过几百本大部著作，不过大端派的书一直是受禁的，法律也规定该派的任何人不 得做官。”（此段译文摘自网上蒋剑锋译的《格利佛游记》第一卷第4章。） 在他那个时代，Swift 是在讽刺英国（Lilliput）和法国（Blefuscu）之间持续的冲突。 Danny Cohen，一位网络协议的早期开创者，第一次使用这两个术语来指代字节顺序 ［24］，后来这个术语被广泛接纳了。
