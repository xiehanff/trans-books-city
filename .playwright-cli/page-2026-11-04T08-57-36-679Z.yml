          - paragraph [ref=f4e1060]: C.请解释虽然练习题5.5中所示的函数需要更多的操作，但是它是如何运行得更快的。 5.8 循环展开 循环展开是一种程序变换，通过增加每次迭代计算的元素的数量，减少循环的迭代次数。 psum2 函数（见图5-1）就是这样一个例子，其中每次迭代计算前置和的两个元素，因而将 需要的迭代次数减半。循环展开能够从两个方面改进程序的性能。首先，它减少了不直接 有助于程序结果的操作的数量，例如循环索引计算和条件分支。第二，它提供了一些方 法，可以进一步变化代码，减少整个计算中关键路径上的操作数量。在本节中，我们会看 一些简单的循环展开，不做任何进一步的变化。 图5-16是合并代码的使用“2X1循环展开”的版本。第一个循环每次处理数组的两个元 素。也就是每次迭代，循环索引主加2，在一次迭代中，对数组元素i和i十1使用合并运算。
          - paragraph [ref=f4e1061]: 一般来说，向量长度不一定是2的倍数。想要使我们的代码对任意向量长度都能正确 工作，可以从两个方面来解释这个需求。首先，要确保第一次循环不会超出数组的界限。 对于长度n的向量，我们将循环界限设为n一1。然后，保证只有当循环索引i满足i< n一1时才会执行这个循环，因此最大数组索引 ：十1满足i十1<（n-1）＋1 n。
          - paragraph [ref=f4e1062]: 把这个思想归纳为对一个循环按任意因子k进行展开，由此产生kX1循环展开。为此， 上限设为 一k十1，在循环内对元素i到i十 一1应用合并运算。每次迭代，循环索引之加k。 那么最大循环索引 i十k一1会小于 n。要使用第二个循环，以每次处理一个元素的方式处理 向量的最后几个元素。这个循环体将会执行0～一1次。对于k=2，我们能用一个简单的条 件语句，可选地增加最后一次迭代，如函数 psum2（图5-1）所示。对于＞2，最后的这些情
