          - paragraph [ref=f4e976]: 在理想的世界里，编译器会认出循环测试中对 strlen 的每次调用都会返回相同的结 果，因此应该能够把这个调用移出循环。这需要非常成熟完善的分析，因为 strlen 会检 查字符串的元素，而随着1ower1 的进行，这些值会改变。编译器需要探查，即使字符串 中的字符发生了改变，但是没有字符会从非零变零，或是反过来，从零变为非零。即使 是使用内联函数，这样的分析也远远超出了最成熟完善的编译器的能力，所以程序员必须 自己进行这样的变换。
