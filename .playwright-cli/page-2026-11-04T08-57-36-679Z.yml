          - paragraph [ref=f4e1107]: 相关限定的 CPE的下界。（提示：画出每次迭代如何计算z的图形化表示会所帮助。） 网络旁注 OPT:SIMD 用向量指令达到更高的并行度 就像在3.1节中讲述的，Intel 在1999年引入了 SSE 指令，SSE 是“Streaming SIMD Extensions（流 SIMD 扩展）”的缩写，而 SIMD（读作 “sim-dee”）是“Single-In- struction,Multiple-Data（单指令多数据）”的缩写。SSE 功能历经几代，最新的版本为 高级向量扩展（advanced vector extension）或 AVX。SIMD 执行模型是用单条指令对整个向 量数据进行操作。这些向量保存在一组特殊的向量寄存器（vector register）中，名宇为品 yn0~8ym15。目前的AVX 向量寄存器长为32字节，因此每一个都可以存放8个32位数 或4个64位数，这些数据既可以是整数也可以是浮点数。AVX 指令可以对这些寄存器执 行向量操作，比如并行执行8组数值或4组数值的加法或乘法。例如，如果 YMM 寄存 器%ymm0 包含8 个单精度浮点数，用ao， …，an表示，而arcx包含8个单精度浮点数的内 存地址，用6，⋯，6， 表示，那么指令 vmulps （%rcx），%ymmo，%ymm1 会从内存中读出8个值，并行地执行8个乘法，计算a：-a：•b：，0≤i≤7，并将得到的
          - paragraph [ref=f4e1108]: 第5章 优化程序性能 377 8个乘积保存到向量寄存器8yml。我们看到，一条指令能够产生对多个数据值的计算， 因此称 “SIMD” 。 GCC 支持对C语言的扩展，能够让程序员在程序中使用向量操作，这些操作能够 被编译成 AVX 的向量指令（以及基于早前的SSE指令的代码）。这种代码风格比直接用 汇编语言写代码要好，因为GCC还可以为其他处理器上的向量指令产生代码。 使用GCC 指令、循环展开和多个累积变量的组合，我们的合并函数能够达到下面的性能： 整数 浮点数 方法 int long long int 标量 10X10 标量吞吐量界限 向量8X8 向量吞吐量界限 十 0.54 0.50 0.05 0.06 1.01 1.00 0. 24 0.12 0.55 0.50 0.13 0.12 * 1.00 1.00 1.51 1.01 1.00 0.12 0.12 0.51. 0.50 0.08 0.06 1.01 1.00 0.25 0.25 * 0.52 0.50 0.16 0.12 上表中，第一组数字对应的是按照 combine6的风格编写的传统标量代码，循环展开因 子为10，并维护10个累积变量。第二组数字对应的代码编写形式可以被 GCC 编译成 AVX 向量代码。除了使用向量操作外，这个版本也进行了循环展开，展开因子为8，并 维护8个不同的向量累积变量。我们给出了 32位和64 位数字的结果，因为向量指令在 第一种情况中达到8路并行，而在第二种情况中只能达到4路并行。 可以看到，向量代码在32位的4种情况下几乎都获得了8倍的提升，对于64位来 说，在其中的3种情况下获得了4倍的提升。只有长整数乘法代码在我们尝试将其表示 为向量代码时性能不佳。AVX指令集不包括64位整数的并行乘法指令，因此GCC无 法为此种情况生成向量代码。使用向量指令对合并操作产生了新的吞吐量界限。与标量 界限相比，32位操作的新界限小了8倍，64 位操作的新界限小了4倍。我们的代码在 几种数据类型和操作的组合上接近了这些界限。 5.10 优化合并代码的结果小结 我们极大化对向量元素加或者乘的函数性能的努力获得了成功。下表总结了对于标量 代码所获得的结果，没有使用AVX向量指令提供的向量并行性： 整数 浮点数 函数 方法 combine1 combine6 抽象-O1 2X2循环展开 10X10 循环展开 延迟界限 吞吐量界限 10.12 0.81. 0.55 1.00 0.50 * 10.12 1.51 1.00 3.00 1.00 10.17
          - list [ref=f4e1109]:
            - listitem [ref=f4e1110]: 51 1.01 3.00 1.00 11.14 2.51 0.52 5.00 0.50 使用多项优化技术，我们获得的CPE 已经接近于 0.50和1.00的吞吐量界限，只受 限于功能单元的容量。与原始代码相比提升了10~20倍，且使用普通的C代码和标准编 译器就获得了所有这些改进。重写代码利用较新的 SIMD指令得到了将近4倍或8倍的性 能提升。比如单精度乘法，CPE 从初值11.14 降到了 0.06，整体性能提升超过180倍。 这个例子说明现代处理器具有相当的计算能力，但是我们可能需要按非常程式化的方式来 编写程序以便将这些能力诱发出来。
          - paragraph [ref=f4e1111]: 378 第一部分 程序结构和执行 5.11 一些限制因素 我们已经看到在一个程序的数据流图表示中，关键路径指明了执行该程序所需时间的 一个基本的下界。也就是说，如果程序中有某条数据相关链，这条链上的所有延迟之和等 于T，那么这个程序至少需要T个周期才能执行完。
          - paragraph [ref=f4e1112]: 我们还看到功能单元的吞吐量界限也是程序执行时间的一个下界。也就是说，假设一 个程序一共需要 N个某种运算的计算，而微处理器只有C个能执行这个操作的功能单元， 并且这些单元的发射时间为1。那么，这个程序的执行至少需要 N•I/C个周期。
          - paragraph [ref=f4e1113]: 在本节中，我们会考虑其他一些制约程序在实际机器上性能的因素。 5.11.1 寄存器溢出 循环并行性的好处受汇编代码描述计算的能力限制。如果我们的并行度p超过了可用 的寄存器数量，那么编译器会诉诸溢出（spilling），将某些临时值存放到内存中，通常是在 运行时堆栈上分配空间。举个例子，将 combine6的多累积变量模式扩展到k=10和為= 20，其结果的比较如下表所示： 盛数 浮点数 函数 方法 combine6 * + 10×10循环展开 20X20循环展开 吞吐量界限 0.55 0.83 0.50 1.00 1.03 1.00 1.01 1.02 1.00 0.52 0.68 0.50 我们可以看到对这种循环展开程度的增加没有改善CPE，有些甚至还变差了。现代 x86-64 处理器有16个寄存器，并可以使用16个 YMM 寄存器来保存浮点数。一旦循环变 量的数量超过了可用寄存器的数量，程序就必须在栈上分配一些变量。
          - paragraph [ref=f4e1114]: 例如，下面的代码片段展示了在10X10循环展开的内循环中，累积变量 acc0是如何 更新的： vmulsd| Updating of accumulator acc0 in 10 x 10 urolling （%rdx），%xmmO，%xmmo accO *= datali］ 我们看到该累积变量被保存在寄存器%xmmO中，因此程序可以简单地从内存中读取 data ［i］，并与这个寄存器相乘。
          - paragraph [ref=f4e1115]: 与之相比，20X20循环展开的相应部分非常不同： Updating of accumulator acc0 in 20 x 20 unrolling vmovsd 40（%rsp），%xnmO vmulsd （%rdx），%xmmo，%xmmO vmovsd %xmmo,40（%rsp） 累积变量保存为栈上的一个局部变量，其位置距离栈指针偏移量为40。程序必须从内存中 读取两个数值：累积变量的值和data［立的值，将两者相乘后，将结果保存回内存。
          - paragraph [ref=f4e1116]: 一旦编译器必须要诉诸寄存器溢出，那么维护多个累积变量的优势就很可能消失。幸 运的是，x86-64有足够多的寄存器，大多数循环在出现寄存器溢出之前就将达到吞吐量 限制。
          - paragraph [ref=f4e1117]: 第5章 优化程序性能 379 5.11.2 分支预测和预测错误处罚 在3.6.6节中通过实验证明，当分支预测逻辑不能正确预测一个分支是否要跳转的时 候，条件分支可能会招致很大的预测错误处罚。既然我们已经学习到了一些关于处理器是 如何工作的知识，就能理解这样的处罚是从哪里产生出来的了。
          - paragraph [ref=f4e1118]: 现代处理器的工作远超前于当前正在执行的指令，从内存读新指令，译码指令，以确 定在什么操作数上执行什么操作。只要指令遵循的是一种简单的顺序，那么这种指令流水 线化（instruction pipelining）就能很好地工作。当遇到分支的时候，处理器必须猜测分支该 往哪个方向走。对于条件转移的情况，这意味着要预测是否会选择分支。对于像间接跳转 （跳转到由一个跳转表条目指定的地址）或过程返回这样的指令，这意味着要预测目标地 址。在这里，我们主要讨论条件分支。
          - paragraph [ref=f4e1119]: 在一个使用投机执行（speculative execution）的处理器中，处理器会开始执行预测的分 支目标处的指令。它会避免修改任何实际的寄存器或内存位置，直到确定了实际的结果。 如果预测正确，那么处理器就会“提交”投机执行的指令的结果，把它们存储到寄存器或 内存。如果预测错误，处理器必须丢弃掉所有投机执行的结果，在正确的位置，重新开始 取指令的过程。这样做会引起预测错误处罚，因在产生有用的结果之前，必须重新填充 指令流水线。
          - paragraph [ref=f4e1120]: 在3.6.6节中我们看到，最近的x86处理器（包含所有可以执行x86-64 程序的处理 器）有条件传送指令。在编译条件语句和表达式的时候，GCC能产生使用这些指令的代 码，而不是更传统的基于控制的条件转移的实现。翻译成条件传送的基本思想是计算出一 个条件表达式或语句两个方向上的值，然后用条件传送选择期望的值。在4.5.7节中我们 看到，条件传送指令可以被实现为普通指令流水线化处理的一部分。没有必要猜测条件是 否满足，因此猜测错误也没有处罚。
          - paragraph [ref=f4e1121]: 那么一个C语言程序员怎么能够保证分支预测处罚不会阻碍程序的效率呢？对于参考 机来说，预测错误处罚是19个时钟周期，赌注很高。对于这个问题没有简单的答案，但 是下面的通用原则是可用的。
          - list [ref=f4e1122]:
            - listitem [ref=f4e1123]: 不要过分关心可预测的分支 我们已经看到错误的分支预测的影响可能非常大，但是这并不意味着所有的程序分支 都会减缓程序的执行。实际上，现代处理器中的分支预测逻辑非常善于辨别不同的分支指 令的有规律的模式和长期的趋势。例如，在合并函数中结束循环的分支通常会被预测为选 择分支，因此只在最后一次会导致预测错误处罚。
