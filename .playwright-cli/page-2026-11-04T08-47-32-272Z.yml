          - paragraph [ref=f1e225]: 关于这些数字，有几点值得注意。第一，从图2-9和图2-10可以看到，补码的范围是 不对称的：ITMinl =|TMax|+1，也就是说，TMin没有与之对应的正数。正如我们将 会看到的，这导致了补码运算的某些特的属性，并且容易造成程序中细微的错误。之所 以会有这样的不对称性，是因为一半的位模式（符号位设置为1的数）表示负数，而另一半 （符号位设置0的数）表示非负数。因为0是非负数，也就意味着能表示的整数比负数少 一个。第二，最大的无符号数值刚好比补码的最大值的两倍大一点：UMax=2TMa.zw+ 1。补码表示中所有表示负数的位模式在无符号表示中都变成了正数。图2-14也给出了常 数一1和0的表示。注意一1 和UMaz 有同样的位表示—一个全1的串。数值0在两种 表示方式中都是全0的串。
          - paragraph [ref=f1e226]: C语言标准并没有要求要用补码形式来表示有符号整数，但是几乎所有的机器都是这 么做的。程序员如果希望代码具有最大可移植性，能够在所有可能的机器上运行，那么除 了图2-11所示的那些范围之外，我们不应该假设任何可表示的数值范围，也不应该假设 有符号数会使用何种特殊的表示方式。另一方面，许多程序的书写都假设用补码来表示有 符号数，并且具有图2-9和图2-10所示的“典型的”取值范围，这些程序也能够在大量的 机器和编译器上移植。C库中的文件<1imits.h>定义了一组常量，来限定编译器运行的 这台机器的不同整型数据类型的取值范围。比如，它定义了常量 INT_MAX、INT_MIN 和 UINT_MAX，它们描述了有符号和无符号整数的范围。对于一个补码的机器，数据类型 int 有w 位，这些常量就对应于 TMazw、TMin。 和 UMazw的值。
          - paragraph [ref=f1e227]: 第2章 信息的表示和处理 47 旁注 关于确定大小的整数类型的更多内容 对于某些程序来说，用某个确定大小的表示来编码数据类型非常重要。例如，当编写程序， 使得机器能够按照一个标准协议在因特网上通信时，让数据类型与协议指定的数据类型兼容是 非常重要的。我们前面看到了，某些C数据类型，特别是 long 型，在不同的机器上有不同的取 值范围，而实际上C语言标准只指定了每种数据类型的最小范围，而不是确定的范围。虽然我 们可以选择与大多数机器上的标准表示兼容的数据类型，但是这也不能保证可移植性。 我们已经见过了32位和64 位版本的确定大小的整数类型（图2-3），它们是一个更 大数据类型类的一部分。ISO C99标准在文件 stdint.h 中引入了这个整数类型类。这 个文件定义了一组数据类型，它们的声明形如 intN_t 和 uintN_t，对不同的N值指定 N 位有符号和无符号整数。N的具体值与实现相关，但是大多数编译器允许的值为8、 16、32和64。因此，通过将它的类型声明为uint16_t，我们可以无歧义地声明一个16 位无符号变量，而如果声明为 int32_t，就是一个32位有符号变量。 这些数据类型对应着一组宏，定义了每个N的值对应的最小和最大值。这些宏名字 形如 INTN MIN、INTN MAX 和 UINTN MAX。 确定宽度类型的带格式打印需要使用宏，以与系统相关的方式扩展为格式串。因 此，举个例子来说，变量x和Y的类型是int32_t和uint64_t，可以通过调用 printf 来打印它们的值，如下所示； printf（“x = %” PRId32 “，y = %” PRIu64 “\n”，x,y）； 编译为 64 位程序时，宏 PRId32展开成字符串“d”，宏 PRIu64 则展开成两个字符串 “］”“u”。当C预处理器遇到仅用空格（或其他空白字符）分隔的一个字符串常量序列时， 就把它们串联起来。因此，上面的printf调用就变成了： printf（“x= %d, y = %luln”，x,y）； 使用宏能保证：不论代码是如何被编译的，都能生成正确的格式字符串。 '关于整数数据类型的取值范围和表示，Java 标准是非常明确的。它要求采用补码表示，取 值范围与图2-10中64位的情况一样。在Java 中，单字节数据类型称为 byte，而不是 char。这 些非常具体的要求都是为了保证无论在什么机器上运行，Java 程序都能表现地完全一样。 旁注有符号数的其他表示方法 有符号数还有两种标准的表示方法： 反码（Ones’ Complement）：除了最高有效位的权是一（2"-1-1）而不是一2，它 和补码是一样的： 原码（Sign-Magnitude）：最高有效位是符号位，用来确定剩下的位应该取负权还是正权： B2Sw（五）=（ 1） （2z:2）） 这两种表示方法都有一个奇怪的属性，那就是对于数字0有两种不同的编码方式。 这两种表示方法，把［00⋯0］都解释为十0。而值一0在原码中表示为［10⋯0］，在反码 中表示为［11⋯1］。虽然过去生产过基于反码表示的机器，但是几乎所有的现代机器都 使用补码。我们将看到在浮点数中有使用原码编码。
